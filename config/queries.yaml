  #    Beschreibung nur, wenn sie zufaellig woertlich so dastand.
  # 2. **Sie denken in Europa, nicht in Deutschland.** Die gefundene Gruppe
  #    bedient "أوروبا، تركيا، سوريا، لبنان، الأردن، مصر" in einem. Wer nur
  #    "ألمانيا" sucht, findet die kleinen und laesst die grossen liegen.
  #
  # Die Begriffe sind aus der Beschreibung und dem sichtbaren Beitrag jener
  # Gruppe genommen, nicht erdacht: "السفرة من المانيا", "جلب", "أمانات",
  # "توصيل". Das ist derselbe Weg wie bei der Erweiterung vom 18.08.2026 -
  # die Grundlage sind gefundene Namen, nicht denkbare Varianten.
  - { id: rv_ar_23, text: "توصيل أمانات",                  lang: ar, audiences: [syrians] }
  - { id: rv_ar_24, text: "نقل أمانات سوريا",              lang: ar, audiences: [syrians] }
  - { id: rv_ar_25, text: "أمانات من ألمانيا إلى سوريا",    lang: ar, audiences: [syrians] }
