  # -- Die Sprache der Kuriergruppen selbst (13.09.2026, nachgetragen) ---
  #
  # ANLASS: Der Nutzer fand von Hand eine oeffentliche Gruppe mit **174.713
  # Mitgliedern** - genau der Zielmarkt, und keine einzige Anfrage dieser
  # Datei haette sie gefunden. Sie heisst nur "بطريقك": kein Stadtname, kein
  # "سوريا", kein Reisewort im Titel. Erst ihre Beschreibung verraet sie
  # ("خدمة مأجورة لمساعدة الأشخاص بإرسال او جلب أشياء من و الى أوروبا، تركيا،
  # سوريا ...").
  #
  # Daraus folgen zwei Lehren, und beide stehen in den Anfragen unten:
  #
  # 1. **Diese Gruppen nennen sich nach ihrer Dienstleistung**, nicht nach
  #    einer Strecke: "توصيل أمانات", "جلب أغراض", "شحن وتوصيل". Die bisherigen
