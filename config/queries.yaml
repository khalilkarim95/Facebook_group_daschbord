  - { id: rv_de_13, text: "Mitfahrgelegenheit Syrien Deutschland", lang: de, audiences: [syrians] }

  # -- Deutsch: Versand und Mitnahme ------------------------------------
  - { id: rv_de_14, text: "Mitnahme nach Syrien",                lang: de, audiences: [syrians] }
  - { id: rv_de_15, text: "Sachen nach Syrien mitnehmen",        lang: de, audiences: [syrians] }
