  - { id: rv_ar_27, text: "إرسال وجلب أغراض",               lang: ar, audiences: [syrians] }
  - { id: rv_ar_28, text: "توصيل أغراض إلى سوريا",          lang: ar, audiences: [syrians] }
  - { id: rv_ar_29, text: "شحن وتوصيل سوريا",              lang: ar, audiences: [syrians] }
  - { id: rv_ar_30, text: "خدمة توصيل أغراض سوريا",         lang: ar, audiences: [syrians] }
  - { id: rv_ar_31, text: "السفرة من ألمانيا إلى سوريا",    lang: ar, audiences: [syrians] }
  - { id: rv_ar_32, text: "مشوار من ألمانيا إلى سوريا",     lang: ar, audiences: [syrians] }

  # Europa statt Deutschland - die grossen Gruppen denken so.
  - { id: rv_ar_33, text: "شحن من أوروبا إلى سوريا",        lang: ar, audiences: [syrians] }
  - { id: rv_ar_34, text: "من أوروبا إلى سوريا",            lang: ar, audiences: [syrians] }
  - { id: rv_ar_35, text: "مسافرين أوروبا سوريا",           lang: ar, audiences: [syrians] }
  - { id: rv_ar_36, text: "مسافرون من أوروبا إلى سوريا",    lang: ar, audiences: [syrians] }
  - { id: rv_ar_37, text: "إرسال أغراض من أوروبا",          lang: ar, audiences: [syrians] }

  # Die Wege, die diese Gruppen unterscheiden - Land, Luft, ueber die Tuerkei.
  - { id: rv_ar_38, text: "شحن بري إلى سوريا",              lang: ar, audiences: [syrians] }
  - { id: rv_ar_39, text: "شحن جوي إلى سوريا",              lang: ar, audiences: [syrians] }
  - { id: rv_ar_40, text: "رحلات برية إلى سوريا",           lang: ar, audiences: [syrians] }

  # Die App heisst so, und der Ausdruck ist zugleich der uebliche Name dieser
  # Dienstleistung ("auf deinem Weg"). Eine Anfrage, ein Credit - und sie
  # findet genau die Gruppen, die sich selbst so nennen.
  - { id: rv_ar_41, text: "بطريقك",                        lang: ar, audiences: [syrians] }

  # Deutsch: dieselbe Dienstleistung, wie sie hier heisst.
  - { id: rv_de_25, text: "Kurier nach Syrien",            lang: de, audiences: [syrians] }
  - { id: rv_de_26, text: "Sachen mitnehmen Syrien",       lang: de, audiences: [syrians] }

# --- A3) Reise und Versand je Stadt (13.09.2026) ---
#
# Vier Muster mal 15 freigeschaltete Staedte = 60 Anfragen.
#
# **Ein eigener Block, damit sie vor den Gemeinschaftsmustern stehen.** Sie
# gehoerten zuerst zu ``city_patterns``, und dort wurden sie je Stadt
# EINSORTIERT: erst die sechzehn Gemeinschaftsanfragen fuer Berlin, dann die
# vier fuer Reise und Versand, dann dasselbe fuer Hamburg. Wer mit ``--limit``
# nur einen Teil abfragt, bekam damit fast nur Gemeinschaftsgruppen - genau
# die dreihundert, die schon im Bestand standen. Der Plan laeuft jetzt: erst
# alles Neue (46 bundesweit + 60 je Stadt = 106), dann das Bekannte.
#
# Warum ueberhaupt auf Stadtebene: Die Reisegruppen, die es gibt, heissen fast
# immer nach einem Abflughafen ("Stuttgart Syrien Flug") und nicht nach dem
# Land. Bundesweit gesucht faellt genau diese Haelfte durch.
#
# Die Staedte des Nutzers, die Phase 2 sind (Mannheim, Karlsruhe, Freiburg,
# Ulm), werden hiervon NICHT erfasst - freigeschaltet wird eine Stadt ueber
# "phase: 1" in cities.yaml und nicht hier.
city_patterns_reise_versand:
  - { id: cp_rv_01, pattern: "{city} Syrien Reise",        lang: de, audiences: [syrians] }
  - { id: cp_rv_02, pattern: "{city} Syrien Flug",         lang: de, audiences: [syrians] }
  - { id: cp_rv_03, pattern: "{city} Syrien Versand",      lang: de, audiences: [syrians] }
  - { id: cp_rv_04, pattern: "سوريين {city_ar} سفر سوريا",  lang: ar, audiences: [syrians] }

# --- B) Stadt-Muster ---
# {city} = name_de, {city_ar} = name_ar
# Jedes Muster kostet so viele Credits, wie es freigeschaltete Staedte gibt
# (Phase 1: 15). Deshalb stehen hier nur Formulierungen, fuer die es in den
# gefundenen Namen einen Beleg gibt - nicht jede denkbare Variante.
city_patterns:
  - { id: cp_01, pattern: "Syrer {city}",       lang: de,       audiences: [syrians] }
  - { id: cp_02, pattern: "Syrer in {city}",    lang: de,       audiences: [syrians] }
  - { id: cp_03, pattern: "سوريين {city_ar}",    lang: ar,       audiences: [syrians] }
  - { id: cp_04, pattern: "سوريين في {city_ar}", lang: ar,       audiences: [syrians] }
  - { id: cp_05, pattern: "Suriyeen {city}",    lang: translit, audiences: [syrians] }
  - { id: cp_06, pattern: "Araber {city}",      lang: de,       audiences: [arabs] }
  - { id: cp_07, pattern: "Araber in {city}",   lang: de,       audiences: [arabs] }
  - { id: cp_08, pattern: "عرب {city_ar}",       lang: ar,       audiences: [arabs] }
  - { id: cp_09, pattern: "عرب في {city_ar}",    lang: ar,       audiences: [arabs] }

  # Erweiterung 18.08.2026 - dieselbe Begruendung wie oben, auf Stadtebene.
  # cp_10 ist der schwerste Einzelposten: "السوريين" mit Artikel ist die
  # haeufigste Schreibweise im Bestand und war auf Stadtebene nicht gefragt.
  - { id: cp_10, pattern: "السوريين في {city_ar}",   lang: ar, audiences: [syrians] }
  - { id: cp_11, pattern: "السوريون في {city_ar}",   lang: ar, audiences: [syrians] }
  - { id: cp_12, pattern: "العرب في {city_ar}",      lang: ar, audiences: [arabs] }
  - { id: cp_13, pattern: "الجالية السورية {city_ar}", lang: ar, audiences: [syrians] }
  - { id: cp_14, pattern: "تجمع السوريين {city_ar}",  lang: ar, audiences: [syrians] }
  - { id: cp_15, pattern: "Syrische {city}",       lang: de, audiences: [syrians] }
  - { id: cp_16, pattern: "Arab {city}",           lang: en, audiences: [arabs] }
