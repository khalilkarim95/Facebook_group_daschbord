            مرحبا شباب، اليوم اكتشفت تطبيق اسمه بطريقك وحبيت خبركم عنه.
            إذا حدا بده يبعت غرض صغير من {ziel} أو إلى {ziel}، التطبيق بيساعده يلاقي مسافر.
            {link}

        - id: afieh
          text: |
            يعطيكم العافية جميعا، حبيت شارك معكم تطبيق جديد شفته اسمه بطريقك.
            الفكرة إنه إذا عندك غرض صغير بدك تبعته إلى {ziel} أو منها، ممكن تلاقي حدا مسافر ومعه مكان بالحقيبة.
            {link}

        - id: yestafid
          text: |
            مرحبا جميعا، يمكن في حدا هون يستفيد من هالتطبيق.
            اسمه بطريقك وبيساعد {zielgruppe} يلاقوا مسافرين لإرسال الأغراض الصغيرة من وإلى {ziel}.
            حبيت شارككم ياه:
            {link}

        - id: jadid
          text: |
            شباب حبيت شارككم شي جديد اكتشفته اليوم.
            في تطبيق اسمه بطريقك، فكرته إنه يربط الشخص اللي بده يبعت غرض صغير مع مسافر رايح أو جاي من {ziel}.
            يمكن يفيد حدا منكم:
            {link}

    kommentar:
      mit_stadt:
        - id: min_fatra
          text: |
            أنا شفت هالتطبيق من فترة، اسمه بطريقك، فكرته إنه إذا بدك تبعت غرض صغير من {stadt} إلى {ziel} بتلاقي مسافر رايح بنفس الاتجاه.
            {link}

        - id: kam_yom
          text: |
            شفت بطريقك من كم يوم، بيخلّيك تلاقي مسافر عنده مكان بالحقيبة إذا بدك تبعت غرض صغير بين {stadt} و{ziel}.
            {link}

        - id: ana_kaman
          text: |
            أنا كمان شفت هالتطبيق، حسب ما فهمت بتسجل الغرض اللي بدك تبعته من {stadt} وبتلاقي مسافر مناسب بالطريق.
            {link}

        - id: sharakta
          text: |
            حبيت شاركها معكم، شفت تطبيق بطريقك وفكرته إنه يربط اللي بده يبعت غرض صغير من {stadt} مع مسافر رايح إلى {ziel}.
            {link}

        - id: alyom
          text: |
            شفت هالفكرة اليوم، بطريقك بتساعدك تلاقي مسافر إذا عندك غرض صغير بدك توصله من {stadt} إلى {ziel}.
            {link}

      ohne_stadt:
        - id: min_fatra
          text: |
            أنا شفت هالتطبيق من فترة، اسمه بطريقك، فكرته إنه إذا بدك تبعت غرض صغير من {ziel} أو إليها بتلاقي مسافر رايح بنفس الاتجاه.
            {link}

        - id: kam_yom
          text: |
            شفت بطريقك من كم يوم، بيخلّيك تلاقي مسافر عنده مكان بالحقيبة إذا بدك تبعت غرض صغير من أو إلى {ziel}.
            {link}

        - id: ana_kaman
          text: |
            أنا كمان شفت هالتطبيق، حسب ما فهمت بتسجل الغرض اللي بدك تبعته وبتلاقي مسافر مناسب بالطريق.
            {link}

        - id: sharakta
          text: |
            حبيت شاركها معكم، شفت تطبيق بطريقك وفكرته إنه يربط اللي بده يبعت غرض صغير مع مسافر رايح أو جاي من {ziel}.
            {link}

        - id: alyom
          text: |
            شفت هالفكرة اليوم، بطريقك بتساعدك تلاقي مسافر إذا عندك غرض صغير بدك توصله من {ziel} أو إليها.
            {link}

  de:

    # ----------------------------------------------------------------- POST
    post:
      mit_stadt:
        - id: frage
          text: |
            {zielgruppe} in {stadt}: Wer von euch fliegt demnaechst in die Heimat?

            Viele hier moechten eine Kleinigkeit mitschicken, und viele Reisende
            haben noch Platz im Koffer. Genau dafuer gibt es B-Tarikak (بطريقك).

            {link}

        - id: einladung
          text: |
            Hallo liebe {zielgruppe} in {stadt} 👋

            B-Tarikak (بطريقك) ist aus einem einfachen Gedanken entstanden: Wer
            reist, findet jemanden, dem er etwas mitnehmen kann - und wer etwas
            schicken moechte, findet jemanden, dem er vertraut.

            Hier entlang:
            {link}

        - id: alltag
          text: |
            Das kleine Paket liegt seit Monaten in der Schublade, und du wartest
            auf jemanden, der ohnehin hinfliegt.

            Genau das loest B-Tarikak (بطريقك): Reisende von und nach {stadt} -
            und Sendungen, die auf jemanden warten. Fuer {zielgruppe} gemacht.

            {link}

        - id: kurz
          text: |
            {zielgruppe} in {stadt}: Du reist - oder du moechtest etwas mitgeben?
            B-Tarikak (بطريقك) bringt euch zusammen.

            {link}

        - id: ablauf
          text: |
            Fuer {zielgruppe} in {stadt} - so funktioniert B-Tarikak (بطريقك):

            • Reisende tragen ihre Reise und den freien Platz ein
            • Wer etwas schicken moechte, sucht eine passende Reise
            • Die Details klaert ihr direkt miteinander

            {link}

