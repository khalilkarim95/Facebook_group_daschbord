# Textvorlagen je Sprache und Einsatzzweck. Die fachliche Wahrheit steht in der
# Konfiguration, nicht im Programm - wie Zielgruppen, Staedte und Gewichte.
#
# WOFUER DAS DA IST
#
# Ohne diese Datei bekamen alle Gruppen einer Kampagne denselben Text, und der
# einzige Unterschied zwischen 310 Beitraegen war der Tracking-Link. Genau
# gleichlautende Beitraege in vielen Gruppen sind das Muster, nach dem
# Facebooks Spam-Erkennung sucht. Der Tonfall soll deshalb aus der Vorlage
# kommen und die Abwechslung aus der Zahl der Vorlagen - nicht aus einem
# Sprachmodell, das bei jedem Aufruf etwas anderes erfindet. Die KI ist ein
# Editor fuer einen fertigen Text, keine Quelle fuer Vielfalt.
#
# ZWEI EINSATZZWECKE - UND SIE TEILEN SICH KEINE VORLAGE
#
#   post        Ein eigenstaendiger Beitrag. Darf Aufmerksamkeit erzeugen, die
#               Zielgruppe ansprechen, kurz erklaeren und mit einem Aufruf
#               enden.
#   kommentar   Eine Antwort unter einem Beitrag, den jemand anderes
#               geschrieben hat. Er reagiert, er eroeffnet nicht: kurz,
#               hilfreich, ohne Begruessung an "alle", ohne Werbeeinstieg.
#
# Ein Post als Kommentar gelesen wirkt wie Spam unter einem fremden Beitrag -
# und ein Kommentar als Post gelesen wie ein Satz ohne Anlass. Deshalb zwei
# getrennte Toepfe und nicht ein gekuerzter Post.
#
# ZWEI TOEPFE JE ZWECK
#
# 152 von 313 Gruppen im Bestand haben keine erkannte Stadt und 115 keine
# Zielgruppe. Eine Vorlage mit "in {stadt}" zerbricht bei der Haelfte des
# Bestands. Deshalb "mit_stadt" und "ohne_stadt" als getrennte Toepfe statt
# eines Platzhalters, der manchmal leer bleibt.
#
# PLATZHALTER
#
#   {zielgruppe}  Anrede aus audiences.yaml - label_ar bzw. label_kurz_de
#   {stadt}       Stadtname aus cities.yaml - name_ar bzw. name_de
#   {gruppe}      Der Name der Facebook-Gruppe. Sparsam verwenden: Er steht
#                 ohnehin ueber dem Beitrag, und wer ihn nennt, klingt schnell
#                 wie ein Serienbrief.
#
#                 ARABISCH: label_ar traegt den bestimmten Artikel und steht
#                 im Genitiv/Akkusativ ("السوريين"). Es gibt nur EINE Form, und
#                 daraus folgt eine Regel fuer jede Vorlage: Vor {zielgruppe}
#                 gehoert ein eigenes Wort (مِن، إلى، أهلنا، مجتمع) - nie ein
#                 angehaengtes Praefix und nie "يا". "لـ" verschmilzt mit dem
#                 Artikel ("لـالسوريين" gibt es nicht), und "يا" vertraegt
#                 keinen Artikel. Wer eine sechste Fassung schreibt, prueft
#                 das zuerst.
#                 DEUTSCH: label_kurz_de steht im Nominativ Plural ("Syrer").
#                 "Wer von euch {zielgruppe}" waere Dativ und damit falsch.
#   {ziel}        Wohin die Reise geht - ziel_ar/ziel_de der Zielgruppe
#                 ("سوريا"). Hat die Zielgruppe kein einzelnes Land (arabs),
#                 greift "ziel_allgemein" weiter unten.
#   {gegenstand}  Was verschickt wird ("غرض"). In den Vorlagen folgt "صغير"
#                 darauf, der Wert muss also maennlich, unbestimmt und
#                 Einzahl sein - "أمانة" waere weiblich und ergaebe
#                 "أمانة صغير".
#   {datum}       Der laufende Monat ("آب"). WIRD HIER NICHT ERSETZT, sondern
#                 erst beim Lesen in "beitrag.mit_link" - wie {link}. Ein beim
#                 Erzeugen eingesetzter Monat stuende noch im Text, wenn der
#                 Beitrag drei Wochen spaeter hinausgeht, und ein Beitrag, der
#                 nach Reisenden im letzten Monat fragt, ist falsch.
#   {link}        Der Tracking-Link. WIRD HIER NICHT ERSETZT: Er kommt erst
#                 beim Lesen in "beitrag.beitragstext" hinein, damit kein
#                 Sprachmodell je einen Tracking-Code zu sehen bekommt.
#                 Jede Vorlage MUSS ihn enthalten - eine Vorlage ohne {link}
#                 ergaebe einen Beitrag, dessen Gruppe nie einen Klick
#                 gutgeschrieben bekommt. "vorlagen.pruefe" weist das ab,
#                 statt es durchgehen zu lassen.
#
# Ein anderer Platzhalter als diese ist ein Fehler und keine Freiheit:
# Er bliebe in geschweiften Klammern im Beitrag stehen. "vorlagen.pruefe"
# meldet ihn, und das Fuellen bricht fuer diese eine Gruppe ab.
#
# DIE KENNUNG IST BEDEUTUNGSTRAGEND, DIE REIHENFOLGE NICHT MEHR
#
# Der Schluessel einer Fassung ist "sprache/zweck/topf/kennung"
# (z. B. "ar/post/mit_stadt/alltag") und wird je Gruppe gespeichert. Damit ist
# Umsortieren gefahrlos geworden - frueher stand dort eine laufende Nummer,
# und wer eine Vorlage in der Mitte einfuegte, verschob alle folgenden.
# Eine KENNUNG zu aendern ist dagegen dasselbe wie die Vorlage zu loeschen:
# Die Gruppen, die sie tragen, waehlen beim naechsten Fuellen neu.
#
# Wer den Bestand nach einer Aenderung neu fuellen will:
#   fbgroups campaign text <kampagne> --aus-vorlage --ueberschreiben --ja
# oder in der Uebersicht "Texte neu erzeugen". Bereits veroeffentlichte
# Beitraege beruehrt das nicht mehr.
#
# DER TEXT SELBST IST VORLAEUFIG.
# Die Mechanik steht; die Formulierungen gehoeren durchgesehen, bevor damit
# 300 Beitraege hinausgehen.

# Die Anrede, wenn weder die Gruppe noch die Kampagne eine Zielgruppe nennt.
# 115 von 313 Gruppen tragen keinen Zielgruppen-Tag. Ohne diesen Rueckfall
# stuende mitten im Satz ein Loch.
anrede_allgemein:
  ar: الأصدقاء
  de: Freunde

# Das Reiseziel, wenn die Zielgruppe keines nennt ({ziel}). "arabs" ist kein
# Land; "الوطن" ist die Antwort, die keine Behauptung ueber die Gruppe
# aufstellt - und in jeden der Saetze passt, in denen {ziel} vorkommt.
ziel_allgemein:
  ar: الوطن
  de: die Heimat

# Was verschickt wird ({gegenstand}). Ein Wort, nicht mehrere Fassungen: In
# den Vorlagen steht "{gegenstand} صغير" - jede Fassung muesste dieselbe
# Genus- und Numerusform haben, und dann sind es fuenf Woerter fuer einen
# Unterschied, den niemand liest.
gegenstand_allgemein:
  ar: غرض
  de: Gegenstand

# Monatsnamen fuer {datum}, eingesetzt beim Lesen. Levantinisch (آب, أيلول)
# und nicht die aegyptisch-arabische Reihe (أغسطس, سبتمبر): Der Zielmarkt sind
# syrische und arabische Communities in Deutschland, und in einer syrischen
# Gruppe klingt "سبتمبر" nach Fremdsprache.
monate:
  ar: [كانون الثاني, شباط, آذار, نيسان, أيّار, حزيران, تموز, آب, أيلول,
       تشرين الأول, تشرين الثاني, كانون الأول]
  de: [Januar, Februar, März, April, Mai, Juni, Juli, August, September,
       Oktober, November, Dezember]

vorlagen:

  # --- Arabisch: die zehn Vorlagen des Nutzers (31.08.2026) ---------------
  #
  # Sie ersetzen die Fassungen vom 28.08.2026 vollstaendig. Der Unterschied
  # ist nicht der Wortlaut, sondern die Haltung: Vorher standen hier Texte,
  # die erklaerten, was die App leistet und was sie nicht leistet - richtig,
  # aber erkennbar geschrieben. Jetzt steht da, was ein Mensch schreibt, der
  # etwas gefunden hat und es weitergibt.
  #
  # **Zwei Aenderungen an den Vorlagen des Nutzers, beide notwendig:**
  #
  #   1. ``{ziel}`` statt des festen "سوريا". Die Vorlagen waren Beispiele
  #      fuer syrische Gruppen; eine irakische Kampagne meint den Irak. Das
  #      Wort kommt aus ``audiences.yaml`` und setzt sich grammatisch genau
  #      dort ein, wo vorher "سوريا" stand.
  #   2. ``{link}`` auch in den Kommentaren. Die Vorlagen enthielten ihn
  #      nicht - ohne ihn bekaeme die Gruppe nie einen Klick gutgeschrieben,
  #      und ``pruefe_platzhalter`` wiese den Text ab.
  #
  # Die Toepfe sind wieder getrennt: ``mit_stadt`` nennt die Stadt der Gruppe,
  # ``ohne_stadt`` kommt ohne aus. 152 von 313 Gruppen haben keine erkannte
  # Stadt - eine Vorlage mit "{stadt}" zerbraeche bei der Haelfte des Bestands.
  ar:
    post:
      mit_stadt:
        - id: entdeckt
          text: |
            مرحبا جميعا، حبيت شارك معكم شغلة جديدة اكتشفتها، تطبيق بطريقك.
            فكرته حلوة، بتساعدك تلاقي مسافر بين {stadt} و{ziel} إذا بدك تبعت غرض صغير.
            هذا الرابط:
            {link}

        - id: shabab
          text: |
            مرحبا شباب، اليوم اكتشفت تطبيق اسمه بطريقك وحبيت خبركم عنه.
            إذا حدا من {stadt} بده يبعت غرض صغير إلى {ziel}، التطبيق بيساعده يلاقي مسافر.
            {link}

        - id: afieh
          text: |
            يعطيكم العافية جميعا، حبيت شارك معكم تطبيق جديد شفته اسمه بطريقك.
            الفكرة إنه إذا عندك غرض صغير بدك تبعته من {stadt} إلى {ziel}، ممكن تلاقي حدا مسافر ومعه مكان بالحقيبة.
            {link}

        - id: yestafid
          text: |
            مرحبا جميعا، يمكن في حدا هون يستفيد من هالتطبيق.
            اسمه بطريقك وبيساعد {zielgruppe} في {stadt} يلاقوا مسافرين لإرسال الأغراض الصغيرة من وإلى {ziel}.
            حبيت شارككم ياه:
            {link}

        - id: jadid
          text: |
            شباب حبيت شارككم شي جديد اكتشفته اليوم.
            في تطبيق اسمه بطريقك، فكرته إنه يربط الشخص اللي بده يبعت غرض صغير من {stadt} مع مسافر رايح إلى {ziel}.
            يمكن يفيد حدا منكم:
            {link}

      # Wortgleich, nur ohne Ortsangabe - fuer die 152 Gruppen ohne erkannte
      # Stadt. Ein "{stadt}" hier waere ein Fehler und wird von ``pruefe``
      # gemeldet.
      ohne_stadt:
        - id: entdeckt
          text: |
            مرحبا جميعا، حبيت شارك معكم شغلة جديدة اكتشفتها، تطبيق بطريقك.
            فكرته حلوة، بتساعدك تلاقي مسافر من أو إلى {ziel} إذا بدك تبعت غرض صغير.
            هذا الرابط:
            {link}

        - id: shabab
