            • Reisende tragen ihre Reise und den freien Platz ein
            • Wer etwas schicken moechte, sucht eine passende Reise
            • Die Details klaert ihr direkt miteinander

            {link}

    # ------------------------------------------------------------ KOMMENTAR
    kommentar:
      mit_stadt:
        - id: hilfreich
          text: |
            Falls hier jemand aus {stadt} etwas in die Heimat schicken moechte:
            Bei B-Tarikak (بطريقك) findet man Reisende, die noch Platz im Koffer
            haben.
            {link}

        - id: direkt
          text: |
            Fuer {zielgruppe} in {stadt} vielleicht interessant:
            {link}

        - id: empfehlung
          text: |
            Wer aus {stadt} fliegt, hat oft Platz - und wer etwas schicken
            moechte, findet niemanden. Genau dafuer gibt es B-Tarikak (بطريقك):
            {link}

        - id: frage
          text: |
            Suchst du gerade jemanden, der von {stadt} aus fliegt? Hier tragen
            Reisende ihre Reise ein:
            {link}

        - id: kurz
          text: |
            Falls du in {stadt} etwas mitgeben moechtest, koennte das passen:
            {link}

      ohne_stadt:
        - id: hilfreich
          text: |
            Falls hier jemand etwas in die Heimat schicken moechte: Bei
            B-Tarikak (بطريقك) findet man Reisende, die noch Platz im Koffer
