# Globale Einstellungen. Alle Werte sind ohne Codeaenderung anpassbar.

paths:
  data_dir: data
  seeds_dir: data/seeds
  exports_dir: data/exports
  runs_dir: data/runs
  sqlite_path: data/groups.sqlite
  # Dauerhafter Anfragespeicher: eine bereits erfolgreich beantwortete Anfrage
  # geht nie ein zweites Mal an den Suchdienst. Bewusst eine eigene Datei -
  # der Bestand (groups.sqlite) bleibt loeschbar, ohne Guthaben zu verlieren.
  query_cache_path: data/query_cache.sqlite

marketing:
  # Basis-URL der Anwendung, die den Tracking-Link entgegennimmt.
  # Die Umgebungsvariable APP_BASE_URL hat Vorrang - so laeuft dieselbe
  # Konfiguration lokal und auf der echten Domain, ohne die gespeicherten
  # Codes anzufassen. Der Code steht fest, nur sein Vorspann wechselt.
  app_base_url: https://b-tarikak.de/

  tracking:
    prefix: FB        # Kanal, erster Teil des Codes: FB-SYR-BER-001
    path: r           # ergibt {APP_BASE_URL}/r/{code}
    number_width: 3   # 001, 002, ...

  # --- Wohin ein Klick fuehrt ------------------------------------------
  #
  # Zwei Ziele stehen zur Wahl, und der Unterschied ist keine Kleinigkeit:
  #
  #   landing  ->  b-tarikak.de/?ref=CODE
  #                Der Code steht in der Adresse, die Web-App liest ihn und
  #                traegt ihn durch die Registrierung. Ein Play-Store-Install
  #                sieht diese Adresse aber nie - wer die App dort holt, ist
  #                fuer die Zuordnung verloren.
  #
  #   store    ->  play.google.com/...&referrer=CODE
  #                Google reicht `referrer` nach der Installation an die App
  #                weiter (Play Install Referrer). Die App liest ihn beim
  #                ersten Start und meldet `activation` mit dem Code. Damit
  #                ueberlebt die Zuordnung den Weg ueber den Store.
  #
  # Je Kampagne einstellbar (`campaign set --ziel store`); hier steht die
  # Vorgabe fuer Kampagnen, die nichts sagen.
  ziel: store

  store:
    # Die echte Package-ID der App (b-tarikak-frontend/android/app/build.gradle.kts).
    # Keine Beispielkennung: Eine falsche fuehrte auf eine fremde oder gar
    # keine Store-Seite, und der Fehler faellt erst auf, wenn niemand die App
    # findet.
    android_package: de.btarikak.app
    # {package} und {referrer} werden ersetzt. `referrer` ist das Feld, das
    # Google nach der Installation an die App zurueckgibt - dort steht der
    # Tracking-Code und sonst nichts.
    play_url: "https://play.google.com/store/apps/details?id={package}&referrer={referrer}"

  # --- Beitrags-Warteschlange -----------------------------------------
  # Alle Stellschrauben des Postens stehen hier und nirgends sonst. Verteilt
  # auf mehrere Dateien waere die Frage "wie lange wartet das System
  # eigentlich?" nur noch durch Lesen des Programms zu beantworten.
  posting:
    # Prioritaet nach ANTEIL der erreichten an den erreichbaren Punkten,
    # nicht nach dem rohen Score. Der Score ist bewusst nicht auf 100
    # normiert: score_max ist 100 ohne veroeffentlichten Beitrag und 175 mit
    # gemessener Resonanz. Eine feste Schwelle bei 90 haette "100 von 100"
    # ueber "130 von 175" gestellt - genau verkehrt herum.
    prioritaet:
      hoch:   0.80    # >= 80 % der erreichbaren Punkte
      mittel: 0.60
      normal: 0.40
      # alles darunter: niedrig

    # Wartezeit zwischen zwei Beitraegen, in Sekunden. Zufaellig aus dem
    # Bereich gezogen: Ein exakt gleichmaessiger Takt ist kein menschliches
    # Verhalten. Das ist keine Verschleierung - es ist die ehrliche Untergrenze
    # dessen, was ein Mensch braucht, um einen Beitrag zu schreiben.
    pause_sekunden_min: 180
    pause_sekunden_max: 420

    # Hoechstens so viele Beitraege je Lauf und je Tag. Die Tagesgrenze ist
    # die wichtigere: 310 Beitraege an einem Tag sind aus jeder Entfernung als
    # Automat erkennbar, gleich wie lange dazwischen gewartet wird.
    max_pro_lauf: 10
    max_pro_tag: 20

    # Wann der taegliche Lauf beginnt. Der Arbeiter schlaeft **nicht** bis
    # dahin: Ein Prozess, der vierzehn Stunden wartet, ueberlebt keinen
    # Neustart und keine Anmeldung. Gestartet wird er von der Aufgaben-
    # planung des Systems; dieser Wert ist die Zeit, die dort einzutragen ist,
    # und `campaign worker --dry-run` gibt den fertigen Befehl aus.
    startzeit: "08:00"

    # Wie oft ein fehlgeschlagener Beitrag erneut versucht werden darf, bevor
    # ein Mensch hinsehen muss.
    max_versuche: 3

    # Sprache und Produkt gehen in den Prompt ein. Sie stehen hier und nicht
    # im Programm: Eine zweite Kampagne auf Deutsch ist eine fachliche
    # Entscheidung, keine Codeaenderung.
    sprache: arabisch
    produkt: >-
      B-Tarikak (بطريقك) - App, ueber die Reisende und Menschen, die etwas
      mitgeben moechten, zueinander finden.

    ki:
      # Welcher Anbieter. 'ollama' laeuft auf dem eigenen Rechner, kostet
      # nichts je Anfrage, und die Angaben ueber die Gruppen verlassen den
      # Rechner nicht - deshalb ist es die Voreinstellung und nicht die
      # Ausweichloesung. 'anthropic' schreibt besseres Arabisch und kostet
      # Geld je Anfrage; es ist eine Entscheidung, kein Zustand.
      #
      # Die Umgebungsvariable AI_PROVIDER hat Vorrang - wie APP_BASE_URL.
      # Es wird nie stillschweigend gewechselt: Ein Ausweichen auf Anthropic,
      # wenn Ollama gerade nicht laeuft, verwandelte einen abgeschalteten
      # Rechner in eine Rechnung.
      anbieter: ollama

      # Wie viele Fassungen je Gruppe. Mehr als eine ist kein Luxus: Bekaeme
      # jede Gruppe den ersten Vorschlag, klaengen 310 Beitraege gleich - und
      # das ist genau das Muster, nach dem Facebooks Spam-Erkennung sucht.
      varianten: 3

      ollama:
        # OLLAMA_BASE_URL und OLLAMA_MODEL aus der Umgebung haben Vorrang.
        base_url: http://localhost:11434
        # Empfehlung fuer eine Karte mit 4 GB Speicher: Ein 4B-Modell passt
        # vollstaendig hinein und antwortet in Sekunden. Ein 8B-Modell muesste
        # sich den Hauptspeicher teilen und braeuchte ungefaehr die zehnfache
        # Zeit je Beitrag - bei besserem Arabisch. Beides ist hier ein
        # Zeilenwechsel, keine Codeaenderung.
        modell: qwen3.5:4b
        # Wie lange auf eine Fassung gewartet wird.
        #
        # Der Wert oben setzt voraus, was der Kommentar sagt: dass das Modell
        # auf der Karte liegt. Tut es das nicht, rechnet es auf der CPU und
        # braucht ein Vielfaches - `fbgroups ki status` meldet diesen Fall
        # ausdruecklich, statt ihn als "verbunden" durchgehen zu lassen.
        #
        # Die Grenze zu heben macht die Erzeugung nicht schneller, nur
        # geduldiger. Der brauchbarere Weg bei CPU-Betrieb ist ein kleineres
        # Modell (`ollama pull qwen2.5:1.5b`) oder Ollama auf die Karte zu
        # bringen.
        timeout_sekunden: 180

      anthropic:
        # Nur wirksam bei anbieter: anthropic. Ohne Schluessel und ohne das
        # Paket bleibt der gesamte Rest des Systems voll benutzbar.
        modell: claude-opus-5
        max_tokens: 8000

    # Ab wann ein 'processing' als verwaist gilt (Arbeiter abgestuerzt).
    # Nichts wird dann automatisch wiederholt - es wird nur gemeldet: Ob in
    # der Gruppe schon ein Beitrag steht, weiss allein ein Mensch, der nachsieht.
    verwaist_nach_minuten: 30

dedupe:
  # Unscharfer Namensabgleich: ab diesem Wert (0-100) gilt ein Paar als
  # Dublettenverdacht. Es wird NICHT automatisch zusammengefuehrt,
  # sondern nur im Report gemeldet.
  fuzzy_threshold: 88
  # Sehr kurze Namen erzeugen zu viele Falschtreffer.
  fuzzy_min_name_length: 8

classification:
  # Treffer im Gruppennamen wiegt schwerer als im Beschreibungstext.
  name_confidence: 1.0
  snippet_confidence: 0.5
  # Ab welcher Konfidenz eine Stadt uebernommen wird.
  city_min_confidence: 0.5

scoring:
  # Summe der Gewichte = 100. Der Score ist die Summe der tatsaechlich
  # belegten Punkte - er wird NICHT hochgerechnet. Was bei der jeweiligen
  # Datenlage hoechstens erreichbar war, steht in der Spalte "Score max.".
  weights:
    # Die Mitgliederzahl ist ABGESCHALTET (Gewicht 0), weil sie sich nicht
    # automatisch beschaffen laesst: Der Suchdienst liefert sie nicht (in 273
    # gespeicherten Treffern kein einziges Mal), und facebook.com wird nicht
    # aufgerufen. Bei Gewicht 45 fehlte sie damit ausnahmslos jeder Gruppe -
    # die Folge war eine Decke von 55 Punkten, die keine Gruppe von einer
    # anderen unterschied. Die Rangfolge entsteht seither aus den Angaben, die
    # tatsaechlich vorliegen; die 45 Punkte sind auf sie verteilt.
    #
    # Wer die Zahl doch von Hand pflegt ("fbgroups pruefliste"), setzt hier
    # wieder ein Gewicht > 0 und ruft "fbgroups rescore" auf. Ein Gewicht von 0
    # nimmt einen Bestandteil vollstaendig aus der Bewertung - er taucht dann
    # auch nicht als "unbekannt" in der Begruendung auf.
    member_count: 0
    audience_match: 45
    city_match: 27
    category_match: 16
    # Beurteilt nur noch die Form des Namens (vollstaendig, kurz, kein
    # Beitragstitel). Zielgruppe und Stadt haben eigene Gewichte und werden
    # hier nicht erneut vergeben - diese Doppelzaehlung war der Grund, weshalb
    # 27 Gruppen gemeinsam auf dem Hoechstwert standen.
    name_quality: 12

    # -- Gemessene Resonanz --------------------------------------------
    # Was die Gruppe tatsaechlich gebracht hat. Die Zahlen stammen aus den
    # eigenen Tracking-Ereignissen (Klick -> Registrierung) und sind das
    # einzige Aktivitaetsmass, das dieses Projekt ohne facebook.com erheben
    # kann: Mitgliederzahl, Beitraege je Woche und aktive Poster stehen
    # ausschliesslich dort. Die Meta Groups API, die sie geliefert haette,
    # wurde am 22.04.2024 vollstaendig abgeschaltet.
    #
    # Sie beantworten die eigentliche Frage ohnehin genauer: nicht "wie viel
    # wird dort geredet?", sondern "wie viele Menschen kommen von dort zu
    # uns?". Eine Gruppe mit 500 Mitgliedern und 40 Registrierungen ist mehr
    # wert als eine mit 5.000 und zwei.
    #
    # Die vier oberen Bestandteile (100 Punkte) beurteilen die PASSUNG - ob
    # die Gruppe zu uns gehoert. Diese drei (75 Punkte) beurteilen die
    # WIRKUNG. Zusammen 175; der Score wird bewusst nicht auf 100 normiert
    # (siehe scoring.py, Regel 3). Eine Gruppe ohne veroeffentlichten Beitrag
    # erreicht damit hoechstens 100 - und "100 von 100" steht zu Recht hinter
    # "130 von 175".
    #
    # Auf 0 setzen schaltet den Bestandteil vollstaendig ab; die Bewertung ist
    # dann exakt die bisherige.
    resonanz_engagement: 50    # Registrierungen je Klick - das Entscheidende
    resonanz_reichweite: 15    # Klicks je veroeffentlichtem Beitrag
    resonanz_aktualitaet: 10   # wie frisch die letzte Regung ist

  # Schwellen der Resonanz. Sie stehen hier und nicht im Code: Eine geaenderte
  # Zielquote ist eine fachliche Entscheidung.
  resonanz:
    # Eine Registrierungsquote, die als "voll" gilt. NICHT 1,0: 15 % sind
    # hervorragend. Wer auf 100 % normiert, gibt selbst der besten Gruppe ein
    # Sechstel der Punkte und macht den Bestandteil wirkungslos.
    ziel_quote: 0.15
    # Ab so vielen Klicks zaehlt die Quote voll, darunter anteilig. 1 Klick
    # und 1 Registrierung sind 100 % und beweisen nichts.
    mindest_klicks: 20
    # Klicks je Beitrag, die als volle Reichweite gelten.
    ziel_klicks_je_beitrag: 25
    # Nach so vielen Tagen ohne Klick ist die Aktualitaet auf 0 gefallen.
    aktualitaet_tage: 30
    # Solange der aelteste Beitrag juenger ist, gilt die Gruppe als NICHT
    # gemessen. Wer vor zwei Stunden gepostet hat, hat noch keine Klicks -
    # eine Null waere hier eine Behauptung ueber die Zukunft.
    schonfrist_tage: 3

  # Punkte (0-1 Anteil) je Mitglieder-Groessenklasse. Erste passende Regel
  # gewinnt. Wirkungslos, solange "member_count: 0" gilt - die Klassen bleiben
  # stehen, damit ein Wiedereinschalten eine reine Zahlenaenderung ist.
  member_count_buckets:
    - { min: 50000, factor: 1.00 }
    - { min: 20000, factor: 0.85 }
    - { min: 10000, factor: 0.70 }
    - { min: 5000,  factor: 0.55 }
    - { min: 1000,  factor: 0.40 }
    - { min: 200,   factor: 0.20 }
    - { min: 0,     factor: 0.05 }
  #
  # Hinweis: Es gibt bewusst KEINEN Ersatzwert fuer eine unbekannte
  # Mitgliederzahl. Ein solcher Wert erzeugte fuer jede Gruppe ohne Metadaten
  # denselben Score. Ist die Zahl unbekannt, entfaellt der Bestandteil: die
  # Gruppe erhaelt dafuer keine Punkte, und "Score max." sinkt entsprechend.
  # Frueher wurde stattdessen auf 100 hochgerechnet - damit erreichte eine
  # Gruppe, von der nur der Name bekannt war, denselben Hoechstwert wie eine
  # belegte Grossgruppe.
  #
  # Das gilt unveraendert fuer jeden eingeschalteten Bestandteil. Abgeschaltet
  # (Gewicht 0) ist etwas anderes als unbekannt: der Bestandteil wird gar nicht
  # erst erwartet, deshalb senkt sein Fehlen "Score max." auch nicht.
