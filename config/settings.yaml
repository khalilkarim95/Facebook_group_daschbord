# Globale Einstellungen. Alle Werte sind ohne Codeaenderung anpassbar.

paths:
  data_dir: data
  sqlite_path: data/groups.sqlite
  # Seit dem Umzug (25.09.2026) liegt der Bestand auf diesem Rechner - und
  # mit ihm Protokoll und Sicherung (Bloecke `protokoll` und `sicherung`).
  log_dir: data/logs
  backup_dir: data/backups

marketing:
  # Wohin {link} in einem Beitrag zeigt, wenn die Kampagne keine eigene
  # landing_page hat: die Startseite der App - ohne Code, ohne Zaehlung.
  # Bis zum 25.09.2026 stand dort ein Tracking-Link je Gruppe
  # (go.b-tarikak.de/r/..., b-tarikak.de/t/...); das Tracking ist entfernt.
  startseite: https://b-tarikak.de/home

  # Der Code einer Zuordnung (FB-SYR-BER-001) - frueher der Tracking-Code,
  # heute nur noch ihre Kennung im Bestand. Er geht nirgends hinaus.
  tracking:
    prefix: FB        # erster Teil des Codes
    number_width: 3   # 001, 002, ...

  # --- Das Ziel einer Kampagne ------------------------------------------
  #
  # Wie viele **erfolgreiche** Kommentare eine Kampagne erreichen soll, bevor
  # die naechste an die Reihe kommt (Anweisung vom 21.09.2026). Gezaehlt
  # werden veroeffentlichte Fassungen; ein Fehlschlag bringt eine Kampagne
  # nie naeher an ihre hundert.
  #
  # Daneben bleibt die alte Bedingung bestehen - jede Gruppe hat ihre zehn
  # Fassungen veroeffentlicht -, und zwar als Garantie fuer den Abschluss:
  # Bei dreizehn Gruppen sind hoechstens 130 moeglich, und eine Kampagne,
  # deren Vorrat vor der Hundert endet, liefe sonst fuer immer.
  #
  # 0 heisst: kein eigenes Ziel, es gilt allein die alte Bedingung.
  #
  # **Seit dem 23.09.2026 240** - gerechnet aus den Vorgaben des Nutzers:
  #
  #     Zeitfenster 12 h = 720 Min,  Abstand 3 Min   ->  240 Kommentare
  #     je Gruppe 20 (Ziel und Tagesmenge)           ->  240 / 20 = 12 Gruppen
  #
  # Mit weniger als zwoelf zugeordneten Gruppen ist die Kampagne ueber die
  # zweite Bedingung erreicht (jede Gruppe hat ihre 20), bei elf also mit 220.
  kampagne:
    ziel_kommentare: 240

  # --- Beitrags-Warteschlange -----------------------------------------
  # Alle Stellschrauben des Postens stehen hier und nirgends sonst. Verteilt
  # auf mehrere Dateien waere die Frage "wie lange wartet das System
  # eigentlich?" nur noch durch Lesen des Programms zu beantworten.
  posting:
    # Prioritaet nach ANTEIL der erreichten an den erreichbaren Punkten,
    # nicht nach dem rohen Score. Der Score ist bewusst nicht auf 100
    # normiert: score_max ist 100 ohne veroeffentlichten Beitrag und 175 mit
    # gemessener Resonanz. Eine feste Schwelle bei 90 haette "100 von 100"
    # ueber "130 von 175" gestellt - genau verkehrt herum.
    prioritaet:
      hoch:   0.80    # >= 80 % der erreichbaren Punkte
      mittel: 0.60
      normal: 0.40
      # alles darunter: niedrig

    # Wie oft ein fehlgeschlagener Beitrag erneut versucht werden darf, bevor
    # ein Mensch hinsehen muss.
    max_versuche: 3

    # Die Sprache waehlt den Vorlagentopf (config/textvorlagen.yaml). Sie
    # steht hier und nicht im Programm: Eine zweite Kampagne auf Deutsch ist
    # eine fachliche Entscheidung, keine Codeaenderung. Eine Kampagne kann
    # eine eigene Sprache tragen; dieser Wert ist die Vorgabe.
    sprache: arabisch
    produkt: >-
      B-Tarikak (بطريقك) - App, ueber die Reisende und Menschen, die etwas
      mitgeben moechten, zueinander finden.

  # --- Wie viel von uns in einem Kommentar stehen darf (13.09.2026) ------
  #
  # Drei Stufen, von wenig nach viel:
  #
  #   no_link         nicht einmal der Name
  #   app_name_only   "بطريقك" wird genannt, ohne Adresse
  #   tracking_link   mit Link
  #
  # Welche Stufe ein einzelner Kommentar bekommt, entscheidet die Antwortart
  # (marketing/entscheidung.py). Dieser Wert ist ein **Deckel** darueber: Er
  # kann nur nach unten wirken. Was die Gruppe verbietet, bleibt verboten;
  # was sie erlaubt, darf man trotzdem sein lassen.
  #
  # "tracking_link" heisst NICHT "immer ein Link". Ein Link geht nur hinaus,
  # wenn die Regeln der Gruppe gelesen sind und keinen verbieten, die Gruppe
  # Links nicht wiederholt abgelehnt hat, der Bezug belegt ist und das Thema
  # die App betrifft. Das sind genau die Bedingungen der Anforderung.
  #
  # "app_name_only" schaltet den Link in Kommentaren **ganz** ab. Das ist eine
  # bewusste Entscheidung mit Preis: Ein Kommentar ohne Link bekommt nie einen
  # Klick gutgeschrieben, und die Zuordnung haengt dann allein am eigenen
  # Beitrag daneben (der traegt seinen Link immer).
  #
  # **Seit dem 23.09.2026 app_name_only** (Anweisung des Nutzers: "Tracking-
  # Link vollstaendig aus Kommentaren entfernen"). Der Deckel ist dabei nur
  # die Auskunft im Protokoll; entfernt wird der Link unabhaengig davon an
  # der Stelle, an der ein Kommentar entsteht (beitrag.mit_link mit texttyp
  # "kommentar", beitrag.ohne_link) und geprueft unmittelbar vor dem Absenden
  # (actions.comment_on_post). Der Beitrag traegt seinen Link weiter.
  linkmodus_max: app_name_only

  # Die **freie** Adresse am Ende jedes Kommentars (23.09.2026, Wunsch des
  # Nutzers: "diese URL in Kommentaren lassen"). Ohne Code und ohne Zaehlung -
  # sie fuehrt geradewegs auf die Landingpage. Eine Tracking-Adresse (/r/,
  # /t/, ?ref=) wird hier nicht angenommen und wirkt wie ein leerer Eintrag.
  # Leer: Kommentare ganz ohne Adresse.
  kommentar_adresse: ""

  # Seit 24.09.2026: Statt der Adresse steht dieser Satz am Ende jedes
  # Kommentars, und das Bild darunter traegt Adresse und Weg zur App. Die
  # ausgeschriebene Adresse machte bei Facebook Probleme. Der Satz geht der
  # Adresse vor; leer faellt es auf kommentar_adresse zurueck.
  kommentar_schluss: "الرابط المباشر للتحميل موجود في البايو (أعلى الصفحة) 👇"

  # Das Bild, das jedem automatischen Kommentar beiliegt (relativ zum
  # Projekt, liegt unter config/ und kommt mit jedem Ausrollen mit). Fehlt
  # die Datei, geht der Kommentar ohne Bild hinaus. Leer: kein Bild.
  kommentar_bild: config/bilder/kommentar.jpg

  # Braucht ein Kommentar einen erkannten **Anlass**, oder genuegt der blosse
  # Bezug? (13.09.2026)
  #
  # Eingeschaltet wird nur geantwortet, wo der Beitrag einen der vorbereiteten
  # Faelle nennt (``marketing/inhalt.Anlass``): jemand sucht einen Reisenden,
  # jemand hat Platz im Koffer, jemand will eine Hoerhilfe, ein Dokument, eine
  # Hodie schicken. "Ich fliege naechste Woche nach Syrien" ist **kein**
  # Anlass - es ist eine Mitteilung, und ein Kommentar darunter waere
  # eingeworfene Werbung.
  #
  # Ausgeschaltet gilt die alte Regel: Der vorbereitete Text der Fassung geht
  # hinaus, sobald die Relevanz reicht. Der Schalter steht hier, weil die
  # Erkennung eng gefasst ist - wer feststellt, dass zu wenig hinausgeht,
  # aendert eine Zahl und keinen Code.
  anlass_pflicht: false

  # --- Bezuege statt Zielklassen (23.09.2026) ------------------------------
  #
  # Bis zum 22.09.2026 stand hier `zielprioritaet`: Zielklassen A-D aus dem
  # Gruppennamen, eine Region (DE/EU/ausserhalb) und eine Schwelle je
  # gepflegter Note. Alles davon ist als Entscheidungsgrundlage entfallen.
  # Eine Gruppe wird nach den **Bezuegen** beurteilt, die in ihren Beitraegen
  # tatsaechlich vorkommen (`marketing/bezug.py`) - und was eine Gruppe ohne
  # Bezug erfaehrt, ist noch nicht festgelegt. Bis dahin werden alle
  # zugeordneten Gruppen gleich behandelt.
  #
  # Was bleibt, ist eine Schwelle fuer jede Gruppe: welche Relevanz ein
  # Beitrag mindestens haben muss, damit geantwortet wird. `mittel` ist der
  # Wert, den am 21.09.2026 ohnehin jede Klasse trug. "niedrig" heisst
  # ebenfalls `mittel` - darunter liegt nur "kein Zusammenhang".
  mindestrelevanz: mittel

# --- Der Waechter (15.09.2026) ------------------------------------------
#
# Sorgt dafuer, dass **ein** `campaign automatik` laeuft, und sonst nichts.
# Einmal starten, dann laeuft er:
#
#     fbgroups campaign watchdog
#
# Seit dem Umzug (25.09.2026) oertlich: Der Lauf liest und bucht in
# data/groups.sqlite, und der Waechter sichert den Bestand nebenbei (Block
# `sicherung`). Dienst und SSH-Tunnel (`server`, `tunnel`) gibt es nicht mehr.
#
# Er enthaelt keine Kampagnenlogik: keine Warteschlange, keine Rangfolge,
# keinen Takt. Er sieht nach, ob ein Lauf die Sperre haelt - und startet
# genau den Befehl, den man sonst von Hand eintippt. Kein `--neu`, also
# wird der offene Lauf fortgesetzt und keine Kampagne von vorn begonnen.
watchdog:
  enabled: true

  # Sekunden zwischen zwei Blicken. Fuenf Minuten sind der Kompromiss aus
  # "merkt einen Absturz schnell" und "steht nicht staendig im Weg": Ein
  # Lauf, der gerade seinen Takt abwartet, haelt die Sperre, also kostet ein
  # Blick nichts. Unter 30 Sekunden wird nicht gegangen - das schuetzt vor
  # einem Tippfehler, nicht vor einer Entscheidung.
  check_interval_seconds: 300

# --- Sicherung (25.09.2026) ---------------------------------------------
#
# Seit dem Umzug liegt der Bestand auf diesem Rechner; der systemd-Timer des
# Servers (fbgroups-backup.timer) sichert nichts mehr. Gesichert wird mit
# der Sicherungsschnittstelle von SQLite, geprueft (integrity_check) und
# gepackt nach `paths.backup_dir`:
#
#     data/backups/sicherung-2026-09-25T132305.sqlite.gz
#
# Wann: vom Waechter, sobald die letzte Sicherung aelter ist als
# `abstand_stunden`; von Hand mit `fbgroups sicherung`; vor jedem
# `fbgroups sicherung --zurueck`.
sicherung:
  # 0 heisst: der Waechter sichert nicht (von Hand geht es weiter).
  abstand_stunden: 24

  # So viele bleiben je Ordner; 0 heisst: alle. Geloescht wird nur, was
  # `sicherung-*.sqlite.gz` heisst - die alten Sicherungen vom Server
  # (groups-2026-08-18.sqlite.gz) bleiben liegen.
  behalten: 30

  # Jede Sicherung zusaetzlich hierhin. data/ liegt auf K: (Festplatte),
  # ~ auf C: (SSD): Ein Plattenschaden nimmt nicht beide mit. Ein Ort, der
  # gerade fehlt (USB-Stick, Netzlaufwerk), wird gemeldet, haelt die
  # Sicherung aber nicht auf. Gegen Diebstahl, Brand oder Verschluesselung
  # hilft nur ein Ort ausser Haus (z. B. ein Cloud-Ordner).
  weitere_ordner:
    - ~/fbgroups-sicherung

# --- Protokoll (25.09.2026) ---------------------------------------------
#
# Was `campaign automatik` und `campaign watchdog` im Fenster zeigen, steht
# zusaetzlich in `paths.log_dir`, eine Datei je Befehl und Tag:
#
#     data/logs/automatik-2026-09-25.log
#     data/logs/waechter-2026-09-25.log
#
# Der Ersatz fuer journalctl auf dem Server. Der Bestand selbst (jeder
# Versuch, jeder Ausgang) steht weiter in der Datenbank.
protokoll:
  # Aeltere Tagesdateien werden beim Start geloescht; 0 heisst: alle behalten.
  tage: 60

scoring:
  # Summe der Gewichte = 100. Der Score ist die Summe der tatsaechlich
  # belegten Punkte - er wird NICHT hochgerechnet. Was bei der jeweiligen
  # Datenlage hoechstens erreichbar war, steht in "Score max.".
  #
  # Die Namen sind die Bestandteile aus scoring.BESTANDTEILE. Ein neuer
  # Bestandteil braucht dort eine Funktion mit @bestandteil(...) und hier eine
  # Zeile - sonst nichts. Ein Gewicht von 0 schaltet einen Bestandteil
  # vollstaendig ab: Er zaehlt keine Punkte und erscheint auch nicht als
  # "unbekannt" in der Begruendung, weil er gar nicht erst erwartet wird.
  weights:
    # -- Reichweite und Betrieb: zusammen die Haelfte ---------------------
    # Das ist die fachliche Vorgabe und keine Feinheit. Eine Gruppe, die
    # thematisch perfekt passt und in der nichts geschieht, ist kein guter
    # Platz fuer einen Beitrag - und umgekehrt bringt die groesste Gruppe
    # nichts, wenn sie tot ist. Deshalb zwei getrennte Bestandteile mit
    # gleichem Gewicht: Sie duerfen einander nicht ersetzen.
    members: 25
    activity: 25

    # -- Passung: die andere Haelfte --------------------------------------
    # Das Thema wiegt schwerer als der Ort, weil eine thematisch passende
    # Gruppe in der Nachbarstadt mehr bringt als eine ortsgenaue, in der es
    # um etwas anderes geht.
    category: 20
    location: 15
    target_audience: 15

    # -- Abgeschaltet (bleibt erhalten) -----------------------------------
    # Die Form des Namens (vollstaendig, kurz, kein Beitragstitel) sagt etwas
    # ueber UNSERE DATEN und nichts ueber die Gruppe. Sie gehoert deshalb in
    # data_confidence und nicht in den Score. Der Bestandteil bleibt stehen,
    # damit das Wiedereinschalten eine Zahlenaenderung ist - hier - und keine
    # Codeaenderung.
    name_quality: 0

  # Punkte (0-1 Anteil) je Mitglieder-Groessenklasse. Erste passende Regel
  # gewinnt, absteigend ausgewertet.
  #
  # BEWUSST NICHT LINEAR. Eine Gruppe mit 100.000 Mitgliedern ist nicht
  # zehnmal so wertvoll wie eine mit 10.000: Oberhalb einiger tausend
  # entscheidet nicht mehr die Groesse, sondern ob dort etwas geschieht -
  # dafuer gibt es "activity". Die Stufen wachsen deshalb ungefaehr
  # logarithmisch; jede Verdopplung bringt etwa gleich viel dazu.
  member_count_buckets:
    - { min: 50000, factor: 1.00 }   # 25,0 Punkte
    - { min: 25000, factor: 0.88 }   # 22,0
    - { min: 10000, factor: 0.76 }   # 19,0
    - { min: 5000,  factor: 0.64 }   # 16,0
    - { min: 2500,  factor: 0.52 }   # 13,0
    - { min: 1000,  factor: 0.40 }   # 10,0
    - { min: 500,   factor: 0.28 }   #  7,0
    - { min: 100,   factor: 0.16 }   #  4,0
    - { min: 0,     factor: 0.04 }   #  1,0
  #
  # Hinweis: Es gibt bewusst KEINEN Ersatzwert fuer eine unbekannte
  # Mitgliederzahl. Ein solcher Wert erzeugte fuer jede Gruppe ohne Metadaten
  # denselben Score. Ist die Zahl unbekannt, entfaellt der Bestandteil: die
  # Gruppe erhaelt dafuer keine Punkte, und "Score max." sinkt entsprechend.
  # Frueher wurde stattdessen auf 100 hochgerechnet - damit erreichte eine
  # Gruppe, von der nur der Name bekannt war, denselben Hoechstwert wie eine
  # belegte Grossgruppe. 27 Gruppen standen auf exakt 100.

  # Anteil der 15 Ortspunkte je Genauigkeitsstufe. Eine erkannte Stadt gibt
  # den vollen Anteil (mal ihrer Konfidenz), alles Groebere anteilig. Die
  # unterste Stufe ist NICHT null: "Deutschland allgemein" ist eine
  # schwaechere Passung als "Bonn", aber immer noch eine. Erst wenn gar
  # nichts erkennbar ist, gilt der Bestandteil als unbekannt.
  location_stufen:
    bundesland: 0.45     # ~6,8 von 15 Punkten
    land: 0.20           # ~3,0 von 15 Punkten

  # Jede erkannte Nebenkategorie hebt die Hauptkategorie an: Eine Gruppe, die
  # drei gesuchte Themen bedient, ist mehr wert als eine, die eines bedient.
  # Gedeckelt, weil zehn Themen zu streifen nicht dasselbe ist wie eines zu
  # treffen - ohne Deckel gewaenne die Gruppe mit dem laengsten Namen.
  kategorie_nebenbonus: 0.08
  kategorie_nebenbonus_max: 0.24

  # Wie die Aktivitaet aus der Beitragsliste der Gruppenseite bewertet wird
  # (Quelle "facebook"). Beitraege je Tag, abgestuft wie die Mitgliederzahl.
  aktivitaet_buckets:
    - { min: 20,  factor: 1.00 }   # aussergewoehnlich viel Betrieb
    - { min: 10,  factor: 0.90 }
    - { min: 5,   factor: 0.75 }
    - { min: 2,   factor: 0.58 }
    - { min: 1,   factor: 0.45 }
    - { min: 0.5, factor: 0.30 }
    - { min: 0.1, factor: 0.15 }
    - { min: 0,   factor: 0.02 }   # praktisch keine Aktivitaet

# --- Kaltmodus: die Kampagne auf Tage verteilen ------------------------------
# Dreihundert Beitraege an einem Tag sind dasselbe Muster, ob ein Programm sie
# absetzt oder ein Mensch sie einfuegt - gezaehlt wird der Beitrag, nicht die
# Hand. Der Takt ist deshalb kein Preis fuer Sicherheit, sondern die Bedingung
# dafuer, dass die dreihundert ueberhaupt ankommen.
#
# Das ist NICHT das am 27.08.2026 entfernte Tageslimit. Jenes zeigte dreissig
# Gruppen und sperrte bei zwanzig - es traf den, der gerade arbeitete. Der
# Kaltmodus teilt vorher zu: Die Arbeitsliste enthaelt nur die heutigen, und
# hinter ihnen steht keine Wand, gegen die man laufen koennte.
kaltmodus:
  # Vom Nutzer am 11.09.2026 abgeschaltet - ausdruecklich und mit Kenntnis der
  # Begruendung darueber ("mach alles ohne limit").
  #
  # ``aktiv: false`` hebt **beides** auf: die Tagesmenge und den Mindestabstand.
  # Es gibt danach keine gezaehlte Grenze mehr und keine Wartezeit - weder auf
  # der Arbeitsseite, noch bei ``campaign auto``, noch am Knopf "Automatisch
  # posten". Die Anzeige "Heute: 0 von 25" verschwindet, weil es nichts mehr
  # zu zaehlen gibt.
  #
  # ``beitraege_pro_tag: 0`` waere dafuer der falsche Weg gewesen: 0 heisst
  # nicht "ohne Grenze", sondern "keiner mehr heute" - ``tagesportion`` liefert
  # dann eine leere Liste und ``kalt_limit_erreicht`` wird wahr. Der Schalter
  # ist der einzige Weg, der wirklich nichts begrenzt.
  #
  # Unberuehrt bleibt ``campaign automatik``: Der Dauerlauf hat die Tagesmenge
  # noch nie gelesen (``automatik.py``: ``aktiv, _pro_tag, abstand``) und
  # richtete sich allein nach dem Abstand. Mit ``aktiv: false`` faellt auch der
  # weg; begrenzt wird ein Lauf jetzt nur noch durch ``--limit N``.
  aktiv: false

  # Beitraege je Tag ueber alle Kampagnen - gezaehlt wurden Beitraege **und**
  # Kommentare, Erfolge wie Fehlschlaege (``store.versuche_heute`` filtert
  # ``texttyp`` nicht). Bei einem Beitrag und zehn Kommentaren je Gruppe sind
  # das elf Vorgaenge, 25 am Tag also gut zwei Gruppen und bei 314 Gruppen rund
  # 136 Tage - die Zahl, die zur Abschaltung gefuehrt hat. Sie steht hier
  # weiterhin fuer den Fall, dass der Takt zurueckkommt.
  beitraege_pro_tag: 25

  # Minuten zwischen zwei Beitraegen - die Grundzeit, nicht die gemessene.
  # Fuenfundzwanzig in zehn Minuten sind dasselbe Muster wie dreihundert an
  # einem Tag, nur schneller.
  #
  # Hier stand bis zum 31.08.2026 "bewusst gleichmaessig und nicht gestreut".
  # Das gilt nicht mehr: ``kaltmodus.naechster_zeitpunkt`` streut die Pause
  # seit dem 30.08.2026 zwischen 80 % und 130 % und legt nach je sieben bis
  # acht Beitraegen eine laengere ein. Der Kommentar beschrieb damit das
  # Gegenteil des Codes - und ein Kommentar, dem man nicht glauben kann, ist
  # schlechter als keiner.
  #
  # Wirkt nur bei ``aktiv: true`` - siehe oben.
  mindestabstand_minuten: 4

# --- Beitrittsanfragen ------------------------------------------------------
# Die riskanteste Handlung des Projekts. Nicht wegen des Inhalts - eine Anfrage
# traegt keinen Text -, sondern wegen der Menge: Am 31.08.2026 standen 311 von
# 314 Gruppen ohne jeden Eintrag. Facebook begrenzt Beitrittsanfragen haerter
# als Beitraege, und an diesem Konto haengen alle bestehenden Mitgliedschaften.
#
# Gruppen mit Beitrittsfragen werden uebersprungen, nicht beantwortet: Eine
# Antwort im Namen des Nutzers zu erfinden ist etwas anderes, als einen Knopf
# zu druecken.
# --- Grenzen je Aktion --------------------------------------------------------
# Wie viel an einem Tag, und wie schnell hintereinander. Gerechnet wird das in
# ``marketing/grenzen.py``; jede Aktion hat ihre eigene Menge, ihren eigenen
# Takt und ihre eigene Sperre.
#
# WICHTIG: Das sind **Planungswerte dieses Programms**, keine offiziellen
# Grenzen von Facebook. Die veroeffentlicht niemand. Sie beschreiben, wie
# vorsichtig wir sein wollen - nicht, was die Gegenseite zulaesst.
#
# Ein Limit fuer Kommentare ist kein Limit fuer Beitraege und erst recht keines
# fuer den ganzen Lauf: Wird eine Aktion gebremst, pausiert nur sie.
#
# `daily: 0` schaltet eine Aktion ganz ab - nicht "unbegrenzt", sondern "gar
# nicht"; dieselbe Bedeutung wie Gewicht 0 im Scoring.
limits:
  join_requests:
    # Vom Nutzer am 13.09.2026 auf 50 gesetzt - dieselbe Zahl, die vor der
    # Umstellung unter `beitritt.anfragen_pro_tag` stand (31.08.2026).
    #
    # **Seit dem 23.09.2026 auf 0**: Die Anfrage ging nur an die Zielklassen
    # A und B, und die sind entfallen. Welche Bezuege eine Anfrage
    # rechtfertigen, ist noch nicht festgelegt - bis dahin geht keine hinaus.
    # Der Weg selbst gilt jetzt fuer jede Gruppe; Einschalten ist diese Zahl.
    daily: 0

  comments:
    # Vom Nutzer am 13.09.2026 auf 100 gesetzt. Der Anlass ist Arithmetik:
    # 254 Gruppen x 10 Fassungen = 2.540 Kommentare. Bei 5 am Tag waere die
    # Kampagne in gut anderthalb Jahren durch.
    #
    # ACHTUNG: Diese Zahl allein erreicht nichts. Was tatsaechlich begrenzt,
    # ist `delays.comment` - bei 20-60 Minuten Abstand passen 36 Kommentare in
    # einen Tag, gleich was hier steht. Die beiden Werte gehoeren zusammen
    # gelesen; wer nur einen aendert, aendert nichts.
    #
    # **Seit dem 23.09.2026 240** = 12 h / 3 Min (siehe `delays.comment` und
    # `marketing.kampagne.ziel_kommentare`). Die Zahl gilt dem Konto ueber
    # alle Kampagnen; die Kampagnen laufen nacheinander.
    daily: 240

    # Hoechstens so viele Kommentare in **derselben** Gruppe an einem Tag.
    # Die Tagesmenge darueber schuetzt das Konto, diese Zahl die Gruppe: Fuenf
    # Kommentare am Tag, alle in derselben Gruppe, sind fuer deren Leser
    # dasselbe Bild wie fuenfzig - und zwei Kommentare unter zwei Beitraegen
    # desselben Menschen sind eine Ansprache zu viel.
    #
    # Sie greift **vor** der Vorlagenwahl: Ist die Zahl erreicht, wird die
    # Gruppe fuer heute uebersprungen und nicht als erschoepft vermerkt - das
    # waere ein Urteil ueber sie statt ueber unseren Takt.
    #
    # 0 schaltet die Grenze ab (unbegrenzt je Gruppe), anders als bei
    # ``daily``: Dort heisst 0 "gar nicht". Der Unterschied ist gewollt - eine
    # Aktion abzuschalten ist eine Entscheidung, eine Schranke wegzulassen
    # heisst nur, dass die Tagesmenge allein zaehlt.
    # Gemeint ist: **ein Kommentar je Gruppe und Tag** - bei 24 Gruppen also
    # bis zu 24 am Tag, nicht einer insgesamt. Die Zahl ist eine Obergrenze
    # je Gruppe; dass jede Gruppe ihren bekommt, sorgt die Arbeitsliste
    # (sie geht alle durch). Ein Mindestwert waere hier nicht ehrlich: Steht
    # in einer Gruppe heute kein passender Beitrag, gibt es keinen Kommentar,
    # und den zu erzwingen hiesse, unter irgendetwas zu schreiben.
    #
    # Gezaehlt werden Versuche, aber **keine technischen Fehlschlaege**
    # (14.09.2026): Bei 1 je Gruppe kostete sonst ein einziges geschlossenes
    # Browserfenster die Gruppe den ganzen Tag.
    # **Seit dem 23.09.2026 20** (Anweisung des Nutzers). Die Runde bleibt:
    # je Runde ein Kommentar je Gruppe, die 20 ist die Obergrenze am Tag.
    je_gruppe_taeglich: 20

  posts:
    daily: 10

# Mindestabstaende in Minuten, gestreut zwischen min und max. Der Beitrag ist
# deutlich langsamer getaktet als der Kommentar: Er steht oben in der Gruppe
# und faellt jedem auf, der sie oeffnet.
delays:
  join_request:
    # Am 13.09.2026 zuerst auf 15-42 gesetzt und noch am selben Tag wieder auf
    # 3-8 zurueck - den Wert vom 31.08.2026. Der Grund stand sofort im Bild:
    #
    #   "Beitrittstakt: noch 31 Min"
    #
    # Der Lauf **wartet** den Beitrittstakt ab, statt inzwischen zu posten
    # (`lauf.naechster_schritt`, Phase BEITRITT). Das ist die geforderte
    # Reihenfolge - erst Beitritt, dann Arbeit - und richtig, solange der
    # Abstand klein ist. Bei 28,5 Minuten Mittel und 50 offenen Anfragen wird
    # daraus: 23,8 Stunden warten, EIN Kommentar am Tag.
    #
    # Die Rechnung, die diese Zahlen traegt:
    #
    #   3-8 Min   ->  50 Anfragen in  4,6 h, danach 83 Kommentare
    #   5-12 Min  ->  50 Anfragen in  7,1 h, danach 72 Kommentare
    #   15-42 Min ->  50 Anfragen in 23,8 h, danach  1 Kommentar
    #
    # Wer hier wieder hochgeht, senkt `limits.join_requests.daily` mit -
    # sonst frisst die Warterei den Tag.
    min_minutes: 3
    max_minutes: 8

  comment:
    # --- Die Rechnung zum Ziel "100 Kommentare am Tag" (15.09.2026) ------
    #
    # ZWEI Schranken, und nur eine davon steht hier. Wer nur an dieser dreht,
    # aendert nichts - derselbe Fehler wie bei `limits.comments.daily`.
    #
    # Schranke 1, der Takt (diese Zahlen):
    #
    #     8-20 Min (Mittel 14,0)  ->  24 h: 103   16 h:  69   12 h:  51
    #     5-12 Min (Mittel  8,5)  ->  24 h: 169   16 h: 113   12 h:  85
    #
    # Am 13.09.2026 stand hier 8-20 mit der Begruendung "genau so passen die
    # 100 in einen Tag". Die Rechnung stimmte nur fuer **durchgehenden
    # Betrieb rund um die Uhr** - der Lauf laeuft aber im sichtbaren Browser
    # des Nutzers, also nicht nachts. Bei realistischen 16 Stunden kam er auf
    # 69 und konnte das Ziel nie erreichen, gleich wie gut die Warteschlange
    # arbeitete.
    #
    # 5-12 ergibt bei 16 Stunden 113 - Luft fuer Fehlschlaege, ohne den Takt
    # auf etwas zu druecken, das nach Maschine aussieht. Der Abstand bleibt
    # gestreut, und die Untergrenze von fuenf Minuten ist bewusst keine
    # Sekundenzahl: Zwei Kommentare im selben Minutentakt sind genau das
    # Muster, nach dem gesucht wird.
    #
    # Schranke 2, die Gruppen (`limits.comments.je_gruppe_taeglich`):
    #
    #     24 Gruppen x 1/Tag =  24      100 Gruppen x 1/Tag = 100
    #     50 Gruppen x 1/Tag =  50      254 Gruppen x 1/Tag = 254
    #
    # **Das ist der tatsaechliche Engpass.** Bei einem Kommentar je Gruppe
    # und Tag braucht es rund hundert zugeordnete, geeignete Gruppen. Am
    # 14.09.2026 hatte die Kampagne 24 - damit waren 24 das Maximum, und kein
    # Takt haette daran etwas geaendert. Der Hebel ist `campaign sync` (mehr
    # A-Gruppen zuordnen), nicht diese Datei.
    #
    # --- Die Rechnung zum Ziel "100 in 12 Stunden" (21.09.2026) ---------
    #
    # Der Takt gilt zwischen zwei **veroeffentlichten** Kommentaren; ein
    # Fehlschlag kostet seit dem 20.09.2026 keine Wartezeit mehr. Damit ist
    # der Mittelwert die ganze Rechnung:
    #
    #     12 h = 720 Min    720 / 6,5 Min = 110 Plaetze
    #
    # Hundert Erfolge brauchen also eine Erfolgsquote von rund 90 % - oder
    # etwas Luft. Bei 5-12 Minuten (Mittel 8,5) waeren es nur 85 Plaetze,
    # und hundert Erfolge damit rechnerisch unmoeglich.
    #
    # Fuenf Minuten sind zugleich die Untergrenze aus der Anforderung
    # ("Kommentar erfolgreich -> 5 Minuten warten"). Die Streuung nach oben
    # bleibt: Ein exakter Takt ist das auffaelligste Muster ueberhaupt.
    #
    # --- Seit dem 23.09.2026: 3 Minuten (Anweisung des Nutzers) ---------
    #
    #     12 h = 720 Min    720 / 3 Min = 240 Plaetze
    #
    # Der Abstand gilt zwischen zwei **veroeffentlichten** Kommentaren. Er ist
    # damit genau, nicht mehr gestreut - der Preis ist ausgesprochen (siehe
    # oben); wer wieder streuen will, setzt max_minutes hoeher.
    #
    # --- Seit dem 24.09.2026: 3-8 Minuten, gestreut (Wunsch des Nutzers) --
    #
    # Ein fester Abstand ist das auffaelligste Muster. Gestreut wird je
    # Kommentar gleichverteilt zwischen min und max (grenzen.naechster_zeitpunkt):
    #
    #     Mittel 5,5 Min    12 h = 720 Min / 5,5 = rund 130 Plaetze
    #
    # limits.comments.daily (240) und das Kampagnenziel bleiben Obergrenzen;
    # erreicht werden in 12 Stunden rund 130. Nach einer Warnung von Facebook
    # (RATE_LIMIT) pausiert die Aktion ohnehin 60 Min, danach verdoppelt.
    min_minutes: 3
    max_minutes: 8

  post:
    min_minutes: 15
    max_minutes: 30

beitritt:
  # ACHTUNG: Diese beiden Werte sind seit dem 12.09.2026 nur noch der
  # Rueckfall. Gelesen wird `limits.join_requests.daily` und
  # `delays.join_request.min_minutes`; die Zahlen hier gelten nur, solange die
  # neuen Schluessel fehlen. So verhaelt sich eine bestehende Installation
  # durch ein Update nicht anders als gestern - aber wer etwas aendern will,
  # aendert es oben.
  #
  # Anfragen je Tag. Vom Nutzer am 31.08.2026 auf 50 gesetzt.
  #
  # Seit dem 12.09.2026 gilt die Zahl auch im Kampagnenlauf: Der Lauf stellt
  # die offenen Anfragen einer Kampagne, bevor er in ihr arbeitet, und hoert
  # damit auf, wenn die Tagesmenge erreicht ist - dann geht es mit der
  # Bewertung und der Arbeit weiter. `0` nimmt die Beitrittsanfragen ganz aus
  # dem Lauf; einen zweiten Schalter dafuer gibt es bewusst nicht.
  # Seit dem 23.09.2026 auf 0 - siehe `limits.join_requests.daily`.
  anfragen_pro_tag: 0

  # Minuten zwischen zwei Anfragen. Gestreut wie beim Kaltmodus - fuenfzig in
  # zehn Minuten waeren dasselbe Muster, nur schneller.
  #
  # Im Lauf **wartet** die Automatik diesen Abstand ab, statt inzwischen
  # Beitraege abzusetzen: Sonst waere die geforderte Reihenfolge (erst
  # Beitritt, dann Arbeit) eine Empfehlung, die jeder Mindestabstand
  # aushebelt. Bei 50 Anfragen sind das gut zweieinhalb Stunden - wer das
  # nicht will, setzt `anfragen_pro_tag` niedriger.
  mindestabstand_minuten: 3

# --- Kommentarautomatik -------------------------------------------------------
automatik:
  # Muss das Konto als Mitglied vermerkt sein, bevor die Automatik es in einer
  # Gruppe versucht?
  #
  # Am 31.08.2026 eingefuehrt, am 01.09.2026 vom Nutzer abgeschaltet. Der
  # Grund fuer beides steht in derselben Beobachtung: In
  # "Betaraqiq-Test Syrer in Berlin" standen drei veroeffentlichte Kommentare,
  # waehrend der Stand auf "beitritt_angefragt" stand. Der Vermerk ist also
  # eine Angabe ueber *unseren* Arbeitsstand und nicht darueber, ob Facebook
  # dort schreiben laesst - und als Vorbedingung hielt er einen Lauf auf, der
  # nachweislich moeglich war.
  #
  # Auf "true" gestellt gilt wieder die alte Regel: Gruppen ohne Mitgliedschaft
  # werden uebersprungen statt versucht. Das ist der Schutz gegen eine Folge
  # sicher scheiternder Versuche aus einem Konto - das Muster, das zur Sperre
  # fuehrt. Ausgeschaltet begrenzen ihn nur noch MAX_VERSUCHE_JE_FASSUNG (3)
  # und danach "erschoepft".
  mitgliedschaft_pflicht: false

  # Kommt in einer Gruppe der Kommentar vor dem Beitrag?
  #
  # Vorgabe im Code ist "false": Erst der eigene Beitrag, dann die zehn
  # Kommentare (Regel vom 10.09.2026 - der Beitrag ist der Anlass und steht
  # in der Gruppe, ein Kommentar haengt an einem fremden).
  #
  # Am 21.09.2026 vom Nutzer umgedreht: "Prioritaet Nr. 1 ist das
  # Kommentieren, der Beitrag ist unwichtig." Eingeschaltet geht in jeder
  # Gruppe der Kommentar zuerst hinaus; der Beitrag kommt, wenn gerade kein
  # Kommentar moeglich ist (Takt, Tagesmenge, kein passender Beitrag).
  # Verloren geht er nicht - er steht nur hinten.
  kommentare_zuerst: true

  # Setzt der Lauf auch den eigenen Beitrag einer Gruppe ab?
  #
  # **Seit dem 23.09.2026 nein** (Anweisung des Nutzers: "Aktuell brauchen
  # wir keinen automatischen Post-Workflow mehr"). Der Lauf verarbeitet dann
  # ausschliesslich Kommentare; kein offener Beitrag haelt eine Gruppe oder
  # eine Kampagne auf, und fuer einen Kommentarschritt entstehen keine
  # Beitragstexte. Der Weg bleibt vollstaendig erhalten - "true" schaltet ihn
  # wieder ein. Von Hand (Arbeitsseite) bleibt der Beitrag unberuehrt.
  beitraege: false

  # Wie viele Scroll-Runden eine Gruppe hoechstens bekommt (23.09.2026,
  # Anweisung des Nutzers; vorher fest 5). Nach JEDER Runde wird beurteilt,
  # was sichtbar ist (Text und Bildtexte, dieselbe Kette wie beim
  # Kommentieren). Seit dem 24.09.2026 werden dabei MINDESTENS 10 Beitraege
  # angesehen (automatik.MINDEST_BEITRAEGE), bevor kommentiert wird - damit
  # es Ausweichziele gibt, wenn der erste nicht annimmt. Beitraege, unter
  # denen der Kommentar technisch nicht ging, sind 24 Stunden gesperrt.
  # Findet sich nach der letzten Runde kein kommentierbarer Beitrag, wird
  # die Gruppe AUSGESCHLOSSEN (bearbeiten = 0, Haken in der Uebersicht
  # nimmt es zurueck). Kommentierte Beitraege zaehlen nicht mit. 1 bis 30.
  scroll_runden: 15

  # Wie lange eine Gruppe ruht, in der gerade nichts Passendes stand.
  #
  # Der Anlass (20.09.2026): Ein Lauf ueber zwoelf Gruppen war nach zwoelf
  # Schritten zu Ende - in neun davon stand "kein passender Beitrag", und
  # jede war damit fuer den ganzen Lauf beiseitegelegt. 11 von 120
  # Kommentaren. "Hier steht gerade nichts" ist aber eine Aussage ueber
  # diesen Augenblick; in einer halben Stunde stehen dort andere Beitraege.
  #
  # Die Zahl ist eine Abwaegung: Zu kurz, und der Lauf holt dieselbe
  # Gruppenseite alle paar Minuten neu, ohne dass sich dort etwas geaendert
  # haette; zu lang, und eine Kampagne mit wenigen Gruppen steht still.
  # Dreissig Minuten sind ungefaehr die Zeit, in der eine lebendige Gruppe
  # einen neuen Beitrag bekommt - und der ist der einzige Grund, es noch
  # einmal zu versuchen.
  #
  # Gilt fuer jeden Besuch ohne Kommentar: "kein Anlass", "alle sichtbaren
  # Beitraege schon kommentiert", "keine Beitraege gefunden", eine geloeschte
  # Beitragsadresse und - seit dem 21.09.2026 - auch den technischen
  # Fehlschlag. Aus der Kampagne faellt dadurch keine Gruppe.
  #
  # **Seit dem 23.09.2026 ordnet die Ruhe nicht mehr, sie haelt nur an.** Die
  # Reihenfolge ist die Runde (lauf.Kampagnenfortschritt.rundenwahl): jede
  # Gruppe einmal, der Reihe nach, dann wieder von vorn. Vorher stand eine
  # Gruppe nach ihrer Ruhe wieder vorn, und bei elf Gruppen kamen nur die
  # ersten vier dran. Die Ruhe ist damit die Ruhephase zwischen zwei Runden:
  # Bei vielen Gruppen ist sie um, bevor die Runde es ist; bei wenigen wird
  # sie abgewartet.
  #
  # **Am 21.09.2026 vom Nutzer auf 2 gesetzt** ("2 Min reichen schon, die
  # Gruppen muessen mehr leisten"). Ein Seitenabruf ist keine Handlung in der
  # Gruppe, und der Takt der Kommentare (delays.comment) bleibt davon
  # unberuehrt.
  ruhe_minuten: 2
