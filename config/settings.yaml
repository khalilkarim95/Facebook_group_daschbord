# Globale Einstellungen. Alle Werte sind ohne Codeaenderung anpassbar.

paths:
  data_dir: data
  seeds_dir: data/seeds
  exports_dir: data/exports
  runs_dir: data/runs
  sqlite_path: data/groups.sqlite
  # Dauerhafter Anfragespeicher: eine bereits erfolgreich beantwortete Anfrage
  # geht nie ein zweites Mal an den Suchdienst. Bewusst eine eigene Datei -
  # der Bestand (groups.sqlite) bleibt loeschbar, ohne Guthaben zu verlieren.
  query_cache_path: data/query_cache.sqlite

marketing:
  # Basis-URL der Anwendung, die den Tracking-Link entgegennimmt.
  # Die Umgebungsvariable APP_BASE_URL hat Vorrang - so laeuft dieselbe
  # Konfiguration lokal und auf der echten Domain, ohne die gespeicherten
  # Codes anzufassen. Der Code steht fest, nur sein Vorspann wechselt.
  app_base_url: https://b-tarikak.de/

  tracking:
    prefix: FB        # Kanal, erster Teil des Codes: FB-SYR-BER-001
    path: r           # ergibt {APP_BASE_URL}/r/{code}
    number_width: 3   # 001, 002, ...

  # --- Wohin ein Klick fuehrt ------------------------------------------
  #
  # Zwei Ziele stehen zur Wahl, und der Unterschied ist keine Kleinigkeit:
  #
  #   landing  ->  b-tarikak.de/?ref=CODE
  #                Der Code steht in der Adresse, die Web-App liest ihn und
  #                traegt ihn durch die Registrierung. Ein Play-Store-Install
  #                sieht diese Adresse aber nie - wer die App dort holt, ist
  #                fuer die Zuordnung verloren.
  #
  #   store    ->  play.google.com/...&referrer=CODE
  #                Google reicht `referrer` nach der Installation an die App
  #                weiter (Play Install Referrer). Die App liest ihn beim
  #                ersten Start und meldet `activation` mit dem Code. Damit
  #                ueberlebt die Zuordnung den Weg ueber den Store.
  #
  # Je Kampagne einstellbar (`campaign set --ziel store`); hier steht die
  # Vorgabe fuer Kampagnen, die nichts sagen.
  ziel: store

  # Wohin ein **Browser-Code** fuehrt (``FB-SYR-BER-010-B``).
  #
  # Seit dem 31.08.2026 traegt jedes Paar zwei Codes: der bestehende zum Play
  # Store, ein zweiter in den Browser. Beide werden vollstaendig gezaehlt -
  # der Unterschied ist allein das Ziel nach der Weiterleitung, und dadurch
  # laesst sich im Trichter unterscheiden, woher ein Mensch kam.
  #
  # Eigener Eintrag und nicht ``fallback_url``: Der Browser ist ein
  # gleichrangiges Ziel, kein Notnagel. Steht an der Kampagne eine eigene
  # ``landing_page``, gilt sie vor diesem Wert.
  browser_url: https://b-tarikak.de/

  store:
    # Die echte Package-ID der App (b-tarikak-frontend/android/app/build.gradle.kts).
    # Keine Beispielkennung: Eine falsche fuehrte auf eine fremde oder gar
    # keine Store-Seite, und der Fehler faellt erst auf, wenn niemand die App
    # findet.
    android_package: de.btarikak.app
    # {package} und {referrer} werden ersetzt. `referrer` ist das Feld, das
    # Google nach der Installation an die App zurueckgibt - dort steht der
    # Tracking-Code und sonst nichts.
    play_url: "https://play.google.com/store/apps/details?id={package}&referrer={referrer}"

  # --- Beitrags-Warteschlange -----------------------------------------
  # Alle Stellschrauben des Postens stehen hier und nirgends sonst. Verteilt
  # auf mehrere Dateien waere die Frage "wie lange wartet das System
  # eigentlich?" nur noch durch Lesen des Programms zu beantworten.
  posting:
    # Prioritaet nach ANTEIL der erreichten an den erreichbaren Punkten,
    # nicht nach dem rohen Score. Der Score ist bewusst nicht auf 100
    # normiert: score_max ist 100 ohne veroeffentlichten Beitrag und 175 mit
    # gemessener Resonanz. Eine feste Schwelle bei 90 haette "100 von 100"
    # ueber "130 von 175" gestellt - genau verkehrt herum.
    prioritaet:
      hoch:   0.80    # >= 80 % der erreichbaren Punkte
      mittel: 0.60
      normal: 0.40
      # alles darunter: niedrig

    # Wie oft ein fehlgeschlagener Beitrag erneut versucht werden darf, bevor
    # ein Mensch hinsehen muss.
    max_versuche: 3

    # Die Sprache waehlt den Vorlagentopf (config/textvorlagen.yaml). Sie
    # steht hier und nicht im Programm: Eine zweite Kampagne auf Deutsch ist
    # eine fachliche Entscheidung, keine Codeaenderung. Eine Kampagne kann
    # eine eigene Sprache tragen; dieser Wert ist die Vorgabe.
    sprache: arabisch
    produkt: >-
      B-Tarikak (بطريقك) - App, ueber die Reisende und Menschen, die etwas
      mitgeben moechten, zueinander finden.

dedupe:
  # Unscharfer Namensabgleich: ab diesem Wert (0-100) gilt ein Paar als
  # Dublettenverdacht. Es wird NICHT automatisch zusammengefuehrt,
  # sondern nur im Report gemeldet.
  fuzzy_threshold: 88
  # Sehr kurze Namen erzeugen zu viele Falschtreffer.
  fuzzy_min_name_length: 8

classification:
  # Treffer im Gruppennamen wiegt schwerer als im Beschreibungstext.
  name_confidence: 1.0
  snippet_confidence: 0.5
  # Ab welcher Konfidenz eine Stadt uebernommen wird.
  city_min_confidence: 0.5

# Abruf der oeffentlich erreichbaren Gruppenseite auf facebook.com
# (fbgroups enrich). Bis zum 27.08.2026 war jeder Zugriff auf facebook.com
# ausgeschlossen; der Nutzer hat die Grenze an diesem Tag ausdruecklich fuer
# das LESEN oeffentlicher Gruppenseiten geoeffnet, weil Mitgliederzahl und
# Aktivitaet zusammen die Haelfte des Scores tragen und nirgends sonst zu
# bekommen sind - in 147 gespeicherten Serper-Antworten kommt keine einzige
# Mitgliederzahl vor.
#
# Was weiterhin ausgeschlossen bleibt: Login, Sitzungsuebernahme, Umgehung
# von Sperren, Personendaten. Siehe extract/gruppenseite.py.
enrich:
  # Sekunden zwischen zwei Abrufen. Bewusst gross: Der Lauf soll langsam und
  # erkennbar sein, nicht schnell und unauffaellig. Bei 313 Gruppen sind 6
  # Sekunden gut eine halbe Stunde - das ist der Preis dafuer, dass niemand
  # den Abruf fuer einen Angriff haelt.
  mindestabstand_sekunden: 6.0

  # Hoechstens so viele Abrufe je Lauf, wenn --alle gesetzt ist. Eine harte
  # Obergrenze wie max_queries_per_run bei der Suche: Wer sich vertippt, soll
  # nicht den ganzen Bestand abrufen.
  max_pro_lauf: 100

  # Nach so vielen Tagen gilt ein Befund als veraltet und wird erneut geholt.
  # Eine Mitgliederzahl von vor einem Jahr ist keine Mitgliederzahl von heute;
  # jeden Tag neu zu fragen waere aber genau der Betrieb, den eine Sperre
  # ausloest.
  hoechstalter_tage: 30

scoring:
  # Summe der Gewichte = 100. Der Score ist die Summe der tatsaechlich
  # belegten Punkte - er wird NICHT hochgerechnet. Was bei der jeweiligen
  # Datenlage hoechstens erreichbar war, steht in "Score max.".
  #
  # Die Namen sind die Bestandteile aus scoring.BESTANDTEILE. Ein neuer
  # Bestandteil braucht dort eine Funktion mit @bestandteil(...) und hier eine
  # Zeile - sonst nichts. Ein Gewicht von 0 schaltet einen Bestandteil
  # vollstaendig ab: Er zaehlt keine Punkte und erscheint auch nicht als
  # "unbekannt" in der Begruendung, weil er gar nicht erst erwartet wird.
  weights:
    # -- Reichweite und Betrieb: zusammen die Haelfte ---------------------
    # Das ist die fachliche Vorgabe und keine Feinheit. Eine Gruppe, die
    # thematisch perfekt passt und in der nichts geschieht, ist kein guter
    # Platz fuer einen Beitrag - und umgekehrt bringt die groesste Gruppe
    # nichts, wenn sie tot ist. Deshalb zwei getrennte Bestandteile mit
    # gleichem Gewicht: Sie duerfen einander nicht ersetzen.
    members: 25
    activity: 25

    # -- Passung: die andere Haelfte --------------------------------------
    # Das Thema wiegt schwerer als der Ort, weil eine thematisch passende
    # Gruppe in der Nachbarstadt mehr bringt als eine ortsgenaue, in der es
    # um etwas anderes geht.
    category: 20
    location: 15
    target_audience: 15

    # -- Abgeschaltet (bleibt erhalten) -----------------------------------
    # Die Form des Namens (vollstaendig, kurz, kein Beitragstitel) sagt etwas
    # ueber UNSERE DATEN und nichts ueber die Gruppe. Sie gehoert deshalb in
    # data_confidence und nicht in den Score. Der Bestandteil bleibt stehen,
    # damit das Wiedereinschalten eine Zahlenaenderung ist - hier - und keine
    # Codeaenderung.
    name_quality: 0

  # Punkte (0-1 Anteil) je Mitglieder-Groessenklasse. Erste passende Regel
  # gewinnt, absteigend ausgewertet.
  #
  # BEWUSST NICHT LINEAR. Eine Gruppe mit 100.000 Mitgliedern ist nicht
  # zehnmal so wertvoll wie eine mit 10.000: Oberhalb einiger tausend
  # entscheidet nicht mehr die Groesse, sondern ob dort etwas geschieht -
  # dafuer gibt es "activity". Die Stufen wachsen deshalb ungefaehr
  # logarithmisch; jede Verdopplung bringt etwa gleich viel dazu.
  member_count_buckets:
    - { min: 50000, factor: 1.00 }   # 25,0 Punkte
    - { min: 25000, factor: 0.88 }   # 22,0
    - { min: 10000, factor: 0.76 }   # 19,0
    - { min: 5000,  factor: 0.64 }   # 16,0
    - { min: 2500,  factor: 0.52 }   # 13,0
    - { min: 1000,  factor: 0.40 }   # 10,0
    - { min: 500,   factor: 0.28 }   #  7,0
    - { min: 100,   factor: 0.16 }   #  4,0
    - { min: 0,     factor: 0.04 }   #  1,0
  #
  # Hinweis: Es gibt bewusst KEINEN Ersatzwert fuer eine unbekannte
  # Mitgliederzahl. Ein solcher Wert erzeugte fuer jede Gruppe ohne Metadaten
  # denselben Score. Ist die Zahl unbekannt, entfaellt der Bestandteil: die
  # Gruppe erhaelt dafuer keine Punkte, und "Score max." sinkt entsprechend.
  # Frueher wurde stattdessen auf 100 hochgerechnet - damit erreichte eine
  # Gruppe, von der nur der Name bekannt war, denselben Hoechstwert wie eine
  # belegte Grossgruppe. 27 Gruppen standen auf exakt 100.

  # Anteil der 15 Ortspunkte je Genauigkeitsstufe. Eine erkannte Stadt gibt
  # den vollen Anteil (mal ihrer Konfidenz), alles Groebere anteilig. Die
  # unterste Stufe ist NICHT null: "Deutschland allgemein" ist eine
  # schwaechere Passung als "Bonn", aber immer noch eine. Erst wenn gar
  # nichts erkennbar ist, gilt der Bestandteil als unbekannt.
  location_stufen:
    bundesland: 0.45     # ~6,8 von 15 Punkten
    land: 0.20           # ~3,0 von 15 Punkten

  # Jede erkannte Nebenkategorie hebt die Hauptkategorie an: Eine Gruppe, die
  # drei gesuchte Themen bedient, ist mehr wert als eine, die eines bedient.
  # Gedeckelt, weil zehn Themen zu streifen nicht dasselbe ist wie eines zu
  # treffen - ohne Deckel gewaenne die Gruppe mit dem laengsten Namen.
  kategorie_nebenbonus: 0.08
  kategorie_nebenbonus_max: 0.24

  # Schwellen der gemessenen Resonanz - einer der Quellen von "activity".
  # Sie stehen hier und nicht im Code: Eine geaenderte Zielquote ist eine
  # fachliche Entscheidung.
  resonanz:
    # Eine Registrierungsquote, die als "voll" gilt. NICHT 1,0: 15 % sind
    # hervorragend. Wer auf 100 % normiert, gibt selbst der besten Gruppe ein
    # Sechstel der Punkte und macht den Bestandteil wirkungslos.
    ziel_quote: 0.15
    # Ab so vielen Klicks zaehlt die Quote voll, darunter anteilig. 1 Klick
    # und 1 Registrierung sind 100 % und beweisen nichts.
    mindest_klicks: 20
    # Klicks je Beitrag, die als volle Reichweite gelten.
    ziel_klicks_je_beitrag: 25
    # Nach so vielen Tagen ohne Klick ist die Aktualitaet auf 0 gefallen.
    aktualitaet_tage: 30
    # Solange der aelteste Beitrag juenger ist, gilt die Gruppe als NICHT
    # gemessen. Wer vor zwei Stunden gepostet hat, hat noch keine Klicks -
    # eine Null waere hier eine Behauptung ueber die Zukunft.
    schonfrist_tage: 3
    # Wie die drei Teilmasse zu EINEM Aktivitaetsfaktor verrechnet werden.
    # Sie werden auf ihre Summe normiert, damit ein Tippfehler die Obergrenze
    # nicht sprengt. Die Registrierungsquote wiegt am schwersten: Klicks sind
    # Neugier, Registrierungen sind das Ergebnis.
    anteile:
      engagement: 0.60
      reichweite: 0.25
      aktualitaet: 0.15

  # Wie die Aktivitaet aus den Datumsangaben der Suchtreffer geschaetzt wird
  # (Quelle "search_dates"). Das ist die schwaechste der drei Quellen und
  # traegt deshalb eine niedrige Konfidenz: Ein indexierter Beitrag von vor
  # zwei Wochen belegt, dass die Gruppe lebt - eine Beitragszahl je Tag ist
  # daraus NICHT abzuleiten. Bewertet wird allein die Frische des juengsten
  # gefundenen Beitrags.
  aktivitaet_aus_treffern:
    # Juenger als das: voller Faktor. Aelter als "tot_ab_tagen": 0.
    frisch_bis_tagen: 7
    tot_ab_tagen: 180
    # Mindestzahl datierter Treffer, damit ueberhaupt geschaetzt wird. Ein
    # einzelner indexierter Beitrag ist ein Zufallsfund.
    mindest_treffer: 1

  # Wie die Aktivitaet aus der Beitragsliste der Gruppenseite bewertet wird
  # (Quelle "facebook"). Beitraege je Tag, abgestuft wie die Mitgliederzahl.
  aktivitaet_buckets:
    - { min: 20,  factor: 1.00 }   # aussergewoehnlich viel Betrieb
    - { min: 10,  factor: 0.90 }
    - { min: 5,   factor: 0.75 }
    - { min: 2,   factor: 0.58 }
    - { min: 1,   factor: 0.45 }
    - { min: 0.5, factor: 0.30 }
    - { min: 0.1, factor: 0.15 }
    - { min: 0,   factor: 0.02 }   # praktisch keine Aktivitaet

# --- Kaltmodus: die Kampagne auf Tage verteilen ------------------------------
# Dreihundert Beitraege an einem Tag sind dasselbe Muster, ob ein Programm sie
# absetzt oder ein Mensch sie einfuegt - gezaehlt wird der Beitrag, nicht die
# Hand. Der Takt ist deshalb kein Preis fuer Sicherheit, sondern die Bedingung
# dafuer, dass die dreihundert ueberhaupt ankommen.
#
# Das ist NICHT das am 27.08.2026 entfernte Tageslimit. Jenes zeigte dreissig
# Gruppen und sperrte bei zwanzig - es traf den, der gerade arbeitete. Der
# Kaltmodus teilt vorher zu: Die Arbeitsliste enthaelt nur die heutigen, und
# hinter ihnen steht keine Wand, gegen die man laufen koennte.
kaltmodus:
  # Voreingestellt aus: Ein Update soll das Verhalten von gestern nicht
  # stillschweigend aendern. Einschalten ist eine Entscheidung.
  aktiv: true

  # Beitraege je Tag ueber alle Kampagnen. 25 bei 310 Gruppen sind knapp
  # dreizehn Tage - die Zahl darf steigen, aber jede Erhoehung ist genau der
  # Handel, den dieser Block beschreibt.
  beitraege_pro_tag: 25

  # Minuten zwischen zwei Beitraegen - die Grundzeit, nicht die gemessene.
  # Fuenfundzwanzig in zehn Minuten sind dasselbe Muster wie dreihundert an
  # einem Tag, nur schneller.
  #
  # Hier stand bis zum 31.08.2026 "bewusst gleichmaessig und nicht gestreut".
  # Das gilt nicht mehr: ``kaltmodus.naechster_zeitpunkt`` streut die Pause
  # seit dem 30.08.2026 zwischen 80 % und 130 % und legt nach je sieben bis
  # acht Beitraegen eine laengere ein. Der Kommentar beschrieb damit das
  # Gegenteil des Codes - und ein Kommentar, dem man nicht glauben kann, ist
  # schlechter als keiner.
  mindestabstand_minuten: 4

# --- Beitrittsanfragen ------------------------------------------------------
# Die riskanteste Handlung des Projekts. Nicht wegen des Inhalts - eine Anfrage
# traegt keinen Text -, sondern wegen der Menge: Am 31.08.2026 standen 311 von
# 314 Gruppen ohne jeden Eintrag. Facebook begrenzt Beitrittsanfragen haerter
# als Beitraege, und an diesem Konto haengen alle bestehenden Mitgliedschaften.
#
# Gruppen mit Beitrittsfragen werden uebersprungen, nicht beantwortet: Eine
# Antwort im Namen des Nutzers zu erfinden ist etwas anderes, als einen Knopf
# zu druecken.
beitritt:
  # Anfragen je Tag. Vom Nutzer am 31.08.2026 auf 50 gesetzt.
  anfragen_pro_tag: 50

  # Minuten zwischen zwei Anfragen. Gestreut wie beim Kaltmodus - fuenfzig in
  # zehn Minuten waeren dasselbe Muster, nur schneller.
  mindestabstand_minuten: 3
