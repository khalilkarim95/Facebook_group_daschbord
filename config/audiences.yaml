# Zielgruppen. Eine Gruppe kann mehrere Tags tragen (z. B. syrians + arabs).
#
# terms.de / terms.translit  -> Abgleich mit Wortgrenzen (lateinische Schrift)
# terms.ar                   -> Teilstring-Abgleich, da im Arabischen Artikel und
#                               Praepositionen direkt am Wort haengen
#                               ("سوريين" ist in "السوريين" enthalten)

audiences:
  syrians:
    label_de: Syrer in Deutschland
    priority: 1
    phase: 1
    terms:
      de: [Syrer, Syrerin, Syrerinnen, Syrien, syrisch, syrische, syrischen]
      ar: [سوريين, سوريون, سورية, سوريا, سوري]
      translit: [Suriyeen, Suriyin, Souriyin, Souriyeen, Syrian, Syrians, Syria]

  arabs:
    label_de: Araber in Deutschland
    priority: 1
    phase: 1
    terms:
      de: [Araber, Araberin, arabisch, arabische, arabischen, Arabische Community]
      ar: [عرب, عربي, عربية, العربية]
      translit: [Arab, Arabs, Arabi, Arabic]

  # --- Phase 2: aktiviert durch phase: 1 ---
