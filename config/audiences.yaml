    label_de: Libanesen in Deutschland
    priority: 2
    phase: 2
    terms:
      de: [Libanese, Libanesen, Libanon, libanesisch]
      ar: [لبناني, لبنانيين, لبنان]
      translit: [Lubnani, Lebanese, Lebanon]

  iraqis:
