# Themenkategorien. Erste Kategorie mit dem hoechsten Trefferzaehler gewinnt.
# Reihenfolge bei Gleichstand = Reihenfolge in dieser Datei.
#
# WARUM "versand" UND "reise" GANZ OBEN STEHEN (13.09.2026)
#
# Sie sind das Thema der Kampagne: B-Tarikak vermittelt zwischen Menschen, die
# eine Kleinigkeit von Deutschland nach Syrien schicken wollen, und Reisenden,
# die Platz im Koffer haben. Eine Gruppe "Reisen Deutschland Syrien" ist damit
# ein anderer Platz als "Syrer in Berlin" - und bis heute trugen beide
# dieselbe Kategorie "community", weil es keine andere gab.
#
# Die Reihenfolge entscheidet bei Gleichstand, und genau der ist der
# Regelfall: "Syrer in Berlin - Reisen nach Damaskus" trifft "community" und
# "reise" mit je einem Namenstreffer. Stuenden sie hinten, gewaenne die
# Gemeinschaft, und die Gruppe waere im Bestand keine Reisegruppe mehr.
#
# Zwei getrennte Kategorien und nicht eine: Wer **schickt**, sucht einen
# Reisenden; wer **reist**, kann etwas mitnehmen. Das sind die beiden Haelften
# desselben Marktplatzes und nicht dasselbe - die Unterscheidung traegt
# ``marketing/inhalt.py`` schon fuer einzelne Beitraege, und der Bestand soll
# sie fuer ganze Gruppen ebenso tragen.
#
# ACHTUNG bei neuen Begriffen: Der lateinische Abgleich erlaubt die
# Wortfortsetzung ("Reise" trifft "Reisende"), aber keine Wortmitte -
# "Flug" trifft "Fluege" NICHT, weil daraus normalisiert "fluege" wird.
# Deshalb stehen beide Schreibweisen ausdruecklich nebeneinander.

categories:
  - id: versand
    label_de: Versand & Mitnahme
    terms:
      de: [Versand, verschicken, Paket, Pakete, Sendung, Mitnahme, mitnehmen,
           mitgeben, Kurier, Warensendung, Lieferung]
      # "جلب" und "بطريقك" nachgetragen am 13.09.2026 aus einer echten Gruppe
      # mit 174.713 Mitgliedern: Sie heisst nur "بطريقك" und beschreibt sich
      # mit "إرسال او جلب أشياء". Diese Gruppen nennen sich nach ihrer
      # Dienstleistung, nicht nach einer Strecke - ohne diese Woerter traegt
      # eine solche Gruppe gar keine Kategorie.
      ar: [شحن, طرد, طرود, ارسال, امانة, امانات, توصيل, مشوار, اغراض, بضاعة,
           جلب, بطريقك]
      translit: [shahn, tard, amanat, parcel, shipping, cargo, delivery]

