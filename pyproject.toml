[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbgroups"
version = "0.1.0"
description = "Facebook Groups Finder - Germany (Phase 1: manual seed pipeline)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "rapidfuzz>=3.6",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Nur fuer den Redirect-Dienst (fbgroups serve). Die Kommandozeile und die
# gesamte Suche laufen ohne diese Pakete.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# NUR fuer den optionalen Anthropic-Weg. Die lokale KI ueber Ollama braucht
# nichts davon: Sie spricht HTTP, und httpx ist bereits Kernabhaengigkeit.
#
# Ohne dieses Extra laeuft alles - Suche, Zuordnung, Warteschlange, Freigabe,
# Veroeffentlichung UND die Beitragsvorschlaege ueber Ollama.
ki = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
fbgroups = "fbgroups.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer deklariert Optionen bewusst als Argument-Defaults - das ist hier idiomatisch.
"src/fbgroups/cli.py" = ["B008"]
"src/fbgroups/marketing/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
packages = ["fbgroups"]
ignore_missing_imports = true
