[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbgroups"
version = "0.1.0"
description = "Facebook-Gruppen pflegen und kommentieren - oertlich, ohne Tracking"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "playwright>=1.42",
]

[project.optional-dependencies]
# Nur fuer die Uebersicht (fbgroups serve). Die Kommandozeile und die
# Automatik laufen ohne diese Pakete.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Der Testclient von FastAPI braucht es.
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
fbgroups = "fbgroups.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer deklariert Optionen bewusst als Argument-Defaults - das ist hier idiomatisch.
"src/fbgroups/cli.py" = ["B008"]
"src/fbgroups/marketing/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
packages = ["fbgroups"]
ignore_missing_imports = true
